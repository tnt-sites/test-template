heading:
  type: markdown
  comment: Headline for the CTA.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
anchorName:
  type: text
  comment: Optional anchor name rendered above the split CTA.
subtext:
  type: markdown
  comment: Supporting copy beneath the headline.
  options:
    blockquote: false
    bold: true
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
imageSource:
  type: image
  comment: Image displayed alongside the CTA content.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text describing the CTA image.
buttonSections:
  type: array
  comment: Buttons for calls-to-action.
  options:
    structures: _structures.buttonSections
learnMoreButtonText:
  type: text
  comment: Text for the Learn More toggle button shown below the CTA content.
learnMoreSections:
  type: array
  comment: Content blocks revealed when the Learn More button is clicked.
  options:
    structures: _structures.containerSections
reverse:
  type: switch
  comment: Reverse the order so buttons appear before the copy.
colorScheme:
  type: select
  comment: Color scheme theme for the CTA.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: default
        name: Default
      - id: contrast
        name: Contrast
backgroundColor:
  type: select
  comment: Background color for the CTA.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.
backgroundGradient:
  type: textarea
  comment: "Optional CSS gradient applied behind the section content."
backgroundImage:
  type: object
  comment: Background image configuration for the section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
rounded:
  type: switch
  comment: Add rounded corners to the CTA section.
