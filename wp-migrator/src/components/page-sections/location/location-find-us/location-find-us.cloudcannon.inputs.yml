id:
  type: text
  comment: Optional HTML id for this section, for anchor links.
heading:
  type: text
  comment: Section heading.
text:
  type: markdown
  comment: Directions to the practice.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: true
    numberedlist: true
    styles: /.cloudcannon/styles/editor.css
backgroundColor:
  type: select
  comment: Section background color.
  options:
    values: _select_data.brandColors
textColor:
  type: select
  comment: Main text color (headings, body copy, captions).
  options:
    values: _select_data.brandColors
accentColor:
  type: select
  comment: Accent color — link/button hover states, star ratings, and similar highlights.
  options:
    values: _select_data.brandColors
iconColor:
  type: select
  comment: Icon color (SVG fill/stroke).
  options:
    values: _select_data.brandColors
