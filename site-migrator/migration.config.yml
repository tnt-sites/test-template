# Migration config for artisandentalmadison.com (WordPress 7.0.4 / Elementor).
#
# The source is a static snapshot of the LIVE site, produced by
# tools/snapshot.mjs — 91 flat <slug>.html files plus a mirrored /wp-content
# tree. The WordPress XML export is NOT the source for pages: page bodies in
# `content:encoded` are stale leftovers, and the real content lives in
# `_elementor_data` postmeta blobs with no CSS. The XML is used only for blog
# posts (tools/import-wordpress.mjs).
#
# WARNING: never run bare `mig detect`. It rewrites `segmentation.chrome` and
# `segmentation.rules` wholesale and strips every comment in this file. Use
# `mig detect --report-only` and hand-transcribe.

source:
  base: file:./static
  # Only read by crawlRemote; the local crawl walks the directory instead.
  entry: []
  exclude:
    # 452KB, 44 top-level sections, no <h1>, title "Xtra" — a scratch/dumping
    # page. Left in, it would dominate clustering with one-off sections.
    - /xtra.html

  # Generated by tools/snapshot.mjs from each sheet's first-seen document
  # position across all 91 pages. ORDER IS THE CASCADE.
  #
  # The globals lead: hello-elementor's reset/theme/header-footer, then
  # Elementor's frontend and per-widget sheets. post-305.css is the Elementor
  # KIT — every --e-global-color-* and --e-global-typography-* lives there, so
  # it is the design-token source. post-309 / post-359 are the header and footer
  # templates. The ~49 remaining post-<id>.css files are per-page; their order
  # relative to each other is immaterial because each is scoped by an Elementor
  # page-id class and none can shadow another.
  stylesheets:
    - wp-content/themes/hello-elementor/assets/css/reset.css
    - wp-includes/css/dist/block-library/style.min.css
    - wp-content/themes/hello-elementor/assets/css/theme.css
