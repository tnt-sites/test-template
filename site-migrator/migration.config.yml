  # Parsed by `mig behaviors` (acorn) for carousel/accordion option objects.
  scripts:
    - wp-content/plugins/elementor/assets/js/frontend.min.js
    - wp-content/plugins/elementor-pro/assets/js/frontend.min.js
    - wp-content/plugins/elementor/assets/lib/swiper/v8/swiper.min.js

  # VERIFIED against the snapshot, not assumed: no `html { font-size }` rule
  # exists in hello-elementor's reset/theme/header-footer or Elementor's
  # custom-frontend. The kit is px-only (body 18px, h1 70px). Pinned to the CSS
  # initial value so rem normalisation is a documented no-op rather than a guess.
  rootFontSizePx: 16
  maxPages: 500

target:
  root: ..
  preset: cloudcannon-astro-starter

segmentation:
  chrome:
    header: header[data-elementor-type="header"]
    footer: footer[data-elementor-type="footer"]
    # Not chrome in the usual sense, but everything listed here is excluded from
    # sections by inChrome() (src/sections/segment.mjs:150), which is exactly
    # what a modal needs: the homepage carries an Elementor popup whose sections
    # would otherwise be migrated as page content.
    popup: '[data-elementor-type="popup"]'

  # Overrides for the CHROME_ROLES defaults in src/chrome/styles.mjs:47-98,
  # which describe the PREVIOUS source's markup (#hd-bottom, `.pho, .phy`).
  # The right-hand side here is Elementor's; preset.chromeTargets stays
  # untouched because those describe the Astro starter's own markup.
  chromeRoleSelectors:
    navLink: .elementor-nav-menu > li > a.elementor-item
    navSubLink: .elementor-nav-menu .sub-menu a.elementor-sub-item
    logo: .elementor-widget-theme-site-logo img, header .elementor-widget-image img
    headerPhone: "a[href^='tel:']"
    footerHeading: .elementor-widget-heading .elementor-heading-title
    footerText: .elementor-widget-text-editor p

  # `body` deliberately. There is no <main> on any page, and the snapshot's
  # template census shows pages arrive in several shapes — single (31),
  # single+wp-page (28), single+wp-post (16), wp-page (8), wp-post (3),
  # archive (1), and one page with no Elementor root at all. Header, footer and
  # popup are excluded by inChrome(), so `body` is both safe and uniform.
  #
  # Do NOT also list `single` / `wp-page`: element-mode matches from overlapping
  # scopes are duplicated, and only NESTED matches are deduped
  # (segment.mjs:146-148).
  roots:
    - body

  viewport: 1280

  rules:
    # Verified against the snapshot: 687 <section> and 90 <div> carry
    # elementor-top-section, and there are no `.e-con` elements anywhere — this
    # site is entirely classic section-based Elementor, not the newer container
    # layout.
    #
    # The selector must NOT be `.elementor-section`: inner sections are nested
    # inside top ones, and innermost-wins dedupe would drop every outer section
    # along with its layout and background. `.elementor-top-section` never
    # nests, so the match set needs no deduping.
    - id: elementor-top
      mode: element
      selector: section.elementor-top-section, div.elementor-top-section
      # The default of 40 folds an image-only, spacer-only or divider-only
      # section into its predecessor. A pixel-faithful port needs one component
      # per source section.
      minTextLength: 0

noise:
  # Only `noise.classes` is wired. `noise.ids` is built into a regex at
  # normalize.mjs:16 and then never used; `noise.attributes` is never read at
  # all. Both are dead schema — do not rely on them.
  #
  # Patterns are anchored ^…$ and matched case-insensitively. classList() feeds
  # BOTH cluster identity (features.distinctiveClass, weight 0.8, and
  # clusterId) AND roleOf() — so a blanket `elementor-.*` would destroy
  # BTN / ICON / CAROUSEL / ACCORDION role detection. Keep this surgical.
  #
  # MUST NOT be suppressed: elementor-button*, elementor-icon*, swiper*,
  # elementor-slides, elementor-carousel, elementor-accordion, elementor-toggle,
  # elementor-tab*, elementor-heading-title, elementor-icon-list*.
  classes:
    # The critical one: a unique per-element hash, 110 of them on a single page.
    # Unsuppressed, every section gets a unique distinctiveClass and clusters
    # one-to-one with itself.
    - elementor-element-[0-9a-f]{6,9}
    - elementor-element
    - elementor-\d+
    - elementor-kit-\d+
    - elementor-page-\d+
    - elementor-location-\w+
    - page-id-\d+
    - postid-\d+
    # Structural wrappers. Stripping these is also what makes clusterId fall
    # back to the role sequence (cluster.mjs:210), giving readable cluster names
    # like `h2-p-img` instead of a hash.
    - elementor-(top-|inner-)?section
    - elementor-section-(boxed|full_width|stretched|height-\w+|content-\w+|items-\w+)
    - elementor-(top-|inner-)?column
    - elementor-col-\d+
    - elementor-container
    - elementor-widget
    - elementor-widget-wrap
    - elementor-widget-container
    - elementor-widget__width-\w+
    - elementor-inner
    - elementor-invisible
    - elementor-hidden-(desktop|tablet|mobile|tablet_extra|mobile_extra)
    - animated
    - animated-\w+
    - (fade|slide|zoom|bounce)(In|Out)\w*
    - wp-(singular|custom-logo|embed-responsive|theme-\S+)
    - (page|post)-template(-\S+)?
    - hello-elementor(-\S+)?

fingerprint:
  # THE most important setting in this file.
  #
  # Elementor nests content as
  #   section > .elementor-container > .elementor-column > .elementor-widget-wrap
  #           > .elementor-widget > .elementor-widget-container > <h2>
  # and isTransparentWrapper refuses to collapse those wrappers because they are
  # all display:flex. Measured against the real DOM, content sits 6-12 levels
  # below the top section.
  #
  # At the default maxDepth of 3, sequence() (normalize.mjs:96-98) returns
  # ["..."] before reaching a single heading, paragraph or image. Every section
  # then fingerprints identically, sequenceDistance returns 0, and the WHOLE
  # SITE collapses into one or two clusters — which checkClusterHealth does not
  # flag, because it only warns about too MANY clusters and singletons.
  #
  # Verify after every scan:  grep -c '"\.\.\."' .migration/scan/clusters.json
  maxDepth: 8

  clusterThreshold: 0.22
  # ~700 top-level sections across 90 pages. The default of 25 is far too tight.
  maxClusters: 45

  identityWeights:
    roleSequence: 0.75
    # Constant across every Elementor section, so they contribute no signal and
    # only dilute the distance scale. measureFeatures reads the SECTION's own
    # computed style, and its single child is the flex .elementor-container:
    # display is always block, so columns is always 1 and flowDirection always
    # "column".
    flowDirection: 0
    columns: 0
    # Elementor's boxed width is 1200px and the bucket list has no 1200, so
    # every section reports "none".
    containerMaxWidth: 0
    hasCarousel: 1.0
    hasAccordion: 1.0
    hasForm: 1.0
    # Only an author-set custom class survives the noise list above.
    distinctiveClass: 0.3

  propFeatures:
    - imageSide
    - buttonCount
    - imageCount
    - textAlign
    - hasOwnBackground

# Header and footer are migrated as DATA by `mig chrome` into src/data/*.json,
# not synthesized as components.
synthesize: []

props:
  # Elementor: class="elementor-button elementor-button-link elementor-size-sm"
  buttonClassPattern: ^(elementor-button(-\w+)?|btn(-alt)?)$
  proseCollapse: true
  maxColorInputs: 12

embeds:
  - match: iframe[src*='google.com/maps']
    prop: mapEmbedUrl
    from: attr:src
  - match: iframe[src*='youtube']
    prop: youtubeId
    from: attr:src
  - match: iframe[src*='vimeo']
    prop: vimeoId
    from: attr:src
  - match: iframe
    prop: embedUrl
    from: attr:src

behaviors:
  jsPluginCalls:
    - swiper
    - Swiper
    - elementorFrontend
  propMap:
    autoplay: autoPlay
    slidesPerView: slidesPerView
    loop: loop
    pagination: showDots
    navigation: showArrows

css:
  tokenize:
    enabled: true
    maxDeltaE: 0.02
  noScope: []

tokens:
  colorMergeDeltaE: 0.025
  minAreaShare: 0.002

urls:
  stripExtension: true
  index:
    from: /index.html
    to: /
  trailingSlash: always

qa:
  breakpoints: [375, 550, 750, 1024, 1280, 1600]
  layoutDiffMaxPercent: 2
  mobileStructureBreakpoint: 1025
  mobileLayoutDiffMaxPercent: 5

interactions: []
