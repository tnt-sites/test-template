collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
    icon: laptop_mac
    url: /[full_slug]/
    disable_url: false
    _enabled_editors:
      - visual
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.
        cascade: true
      $.pageSections[*].tourSlides[*].src:
        type: image
        cascade: true
      $.pageSections[*].tourSlides:
        cascade: true
    add_options:
      - name: Add New Page
        icon: pages
        schema: default
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url: /
    schemas:
      default:
        path: .cloudcannon/schemas/page.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Page
  blog:
    path: src/content/blog
    glob:
      - "**/*.mdx"
    icon: article
    url: /blog/[full_slug]/
    disable_url: false
    _enabled_editors:
      - content
    _inputs:
      title:
        type: text
        comment: The title of the blog post.
        cascade: true
      description:
        type: text
        comment: A brief description of the blog post.
        cascade: true
      date:
        type: date
        comment: The publication date.
        cascade: true
      author:
        type: text
        comment: The author of the blog post.
        cascade: true
      image:
        type: image
        options:
          paths:
            uploads: src/assets/images
        comment: Optional image path for the blog post.
        cascade: true
      tags:
        type: array
        comment: Tags relevant to this post's content.
        cascade: true
    add_options:
      - name: Add New Blog Post
        icon: article
        schema: default
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.mdx"
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url: /blog/
    schemas:
      default:
        path: .cloudcannon/schemas/blog-post.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Blog Post
  data:
    path: src/data
    glob:
      - "**/*.json"
    icon: database
    disable_url: false
    _enabled_editors:
      - data
    _inputs:
      logoSource:
        type: image
        options:
          paths:
            uploads: src/assets/images
        cascade: true
      image:
        type: image
        options:
          paths:
            uploads: src/assets/images
        cascade: true
      navData:
        type: array
        options:
          structures: _structures.navData
        cascade: true
      buttonSections:
        type: array
        options:
          structures: _structures.buttonSections
        cascade: true
      pageButtons:
        type: array
        options:
          structures: _structures.buttonSections
        cascade: true
      colorBrand:
        type: color
        cascade: true
        comment: Primary brand color (--color-brand).
      colorBrandSecondary:
        type: color
        cascade: true
        comment: Secondary brand color (--color-brand-secondary).
      colorBrandTertiary:
        type: color
        cascade: true
        comment: Tertiary brand color (--color-brand-muted).
      colorBrandSubtle:
        type: color
        cascade: true
        comment: Subtle brand color, usually a neutral tone (--color-brand-subtle).
      colorBrandOn:
        type: color
        cascade: true
        comment: Color overlaid on brand-colored backgrounds (--color-brand-on).
      colorTextOnBrand:
        type: color
        cascade: true
        comment: Text color on brand-colored backgrounds (--color-text-on-brand).
      colorLink:
        type: color
        cascade: true
        comment: Hyperlink color (--color-link).
      colorLinkHover:
        type: color
        cascade: true
        comment: Hyperlink hover color (--color-link-hover).
      extraColors:
        type: array
        cascade: true
        comment: Additional CSS color variable overrides for custom tokens.
        options:
          structures:
            values:
              - value:
                  variable: ""
                  value: ""
                label: Color Override
      $.extraColors[*].variable:
        type: text
        cascade: true
        comment: "CSS variable name including --, e.g. --color-header-bg"
      $.extraColors[*].value:
        type: color
        cascade: true
        comment: The color value.
      bodyFont:
        type: object
        cascade: true
        comment: Body text font settings.
      bodyFont.fontFamily:
        type: text
        cascade: true
        comment: 'CSS font-family string, e.g. "Raleway", sans-serif'
      headingsFont:
        type: object
        cascade: true
        comment: Headings font settings.
      headingsFont.fontFamily:
        type: text
        cascade: true
        comment: 'CSS font-family string, e.g. "Playfair Display", serif'
      fontLinks:
        type: array
        cascade: true
        comment: Font stylesheet links for the site (Google, Adobe, or mixed).
      $.fontLinks[*]:
        type: url
        cascade: true
        comment: Full stylesheet URL.
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  landing_pages:
    path: src/content/landing-pages
    name: Landing Pages
    icon: stars
    url: /landing/[full_slug]/
    disable_url: false
    _enabled_editors:
      - visual
    _inputs:
      landingMainNav:
        type: array
        comment: Add one header component for this landing page. Each page can choose a different header style/structure.
        cascade: true
        options:
          structures: _structures.landingHeaderSections
      landingFooter:
        type: array
        comment: Add one footer component for this landing page. Each page can choose a different footer style/structure.
        cascade: true
        options:
          structures: _structures.landingFooterSections
      landingPageSections:
        type: array
        comment: Landing Page Sections
        cascade: true
        options:
          structures: _structures.landingPageSections
      $.landingPageSections[*].items[*].desktopImage.source:
        type: image
        cascade: true
      $.landingPageSections[*].items[*].mobileImage.source:
        type: image
        cascade: true
      $.landingPageSections[*].items[*].listText:
        type: markdown
        options:
          allow_resize: true
          allow_custom_markup: false
          remove_custom_markup: false
          initial_height: 320
          image_size_attributes: true
        cascade: true
      head_scripts:
        type: array
        comment: Scripts injected into the <head> for this page (e.g. Google Analytics). Sub-pages (form, thank you, etc.) inherit this value.
        cascade: true
      $.head_scripts[*]:
        type: textarea
        comment: A single script tag or snippet for the head.
        cascade: true
      footer_scripts:
        type: array
        comment: Scripts injected before </body>. Sub-pages (form, thank you, etc.) inherit this value.
        cascade: true
      $.footer_scripts[*]:
        type: textarea
        comment: A single script tag or snippet for the footer.
        cascade: true
      extraFonts:
        type: array
        comment: Extra font stylesheets for this landing page only (e.g. a Google or Adobe Fonts URL). Does not affect the rest of the site.
        cascade: true
      $.extraFonts[*]:
        type: url
        comment: Full stylesheet URL, e.g. https://fonts.googleapis.com/css2?family=Raleway&display=swap
        cascade: true
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    add_options:
      - name: AI Answers
        icon: stars
        schema: landing-page-ai-answers
      - name: Landing Page (Base)
        icon: stars
        schema: landing-page
      - name: Landing Page (Cosmetic)
        icon: stars
        schema: landing-page-cosmetic
      - name: Landing Page (Count On Us)
        icon: stars
        schema: landing-page-count-on-us
      - name: Landing Page (Pediatric Waves)
        icon: stars
        schema: landing-page-pediatric-waves
      - name: Landing Page (Pediatric Superhero)
        icon: stars
        schema: landing-page-pediatric-superhero
      - name: Landing Page (Custom)
        icon: stars
        schema: landing-page-custom
      - name: Landing Page (Dental Implants)
        icon: stars
        schema: landing-page-dental-implants
      - name: Landing Page (Emergency)
        icon: stars
        schema: landing-page-emergency
      - name: Landing Page (Invisalign)
        icon: stars
        schema: landing-page-invisalign
      - name: Landing Page (New Patient Emergency Combo)
        icon: stars
        schema: landing-page-new-patient-emergency-combo
      - name: Landing Page (New Patient Split Banner)
        icon: stars
        schema: landing-page-new-patient-split-banner
      - name: Landing Page (New Patient Three Callouts)
        icon: stars
        schema: landing-page-np-three-callouts
      - name: Landing Page (Form)
        icon: stars
        schema: landing-page-form
      - name: Landing Page (Thank You)
        icon: check_circle
        schema: landing-page-thank-you
      - name: Landing Page (Privacy Policy)
        icon: policy
        schema: landing-page-privacy-policy
      - name: Landing Page (Sitemap)
        icon: account_tree
        schema: landing-page-sitemap
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url: /test-page/
    schemas:
      landing-page:
        path: .cloudcannon/schemas/landing-page.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: Landing Page (Base)
        icon: stars
        _enabled_editors:
