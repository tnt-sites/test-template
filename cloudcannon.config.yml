collection_groups:
  - heading: Content
    collections:
      - pages
      - blog
  - heading: Data
    collections:
      - data
  - heading: Landing Pages
    collections:
      - landing_pages
  - heading: PEP Pages
    collections:
      - pep_pages
file_config:
  - glob: src/data/fixedTabs.json
    _inputs:
      $.tabs[*].title:
        type: text
        comment: Title of the tab.
        cascade: true
      $.tabs[*].icon:
        type: select
        comment: Select an icon for the tab.
        options:
          values: _select_data.icons
          preview:
            text:
              - key: name
            image:
              - template: src/icons/{id}.svg
        cascade: true
      $.tabs[*].href:
        type: text
        comment: URL the tab links to (use "#modal-id" to open a modal).
        cascade: true
      $.tabs[*].modal:
        type: switch
        comment: Open this tab as a modal (Used to open modals to show multiple offices, etc).
        cascade: true
      $.tabs[*].newTab:
        type: switch
        comment: Open this link in a new tab.
        cascade: true
      $.tabs[*].textMobile:
        type: text
        comment: Text to display on mobile devices.
        cascade: true
      $.tabs[*].textStrong:
        type: text
        comment: Strong text for the tab (displayed on side tabs and larger screens).
        cascade: true
      $.tabs[*].enabled:
        type: switch
        comment: Toggle this tab on or off.
        cascade: true
  - glob: src/data/siteInfo.json
    _inputs:
      $.offices[*].name:
        type: text
        comment: Name of the office location (Leave blank if not applicable).
        cascade: true
      $.offices[*].addresses[*].lines:
        type: array
        comment: Address lines for the office location.
        cascade: true
      $.offices[*].addresses[*].city:
        type: text
        comment: City for the office location.
        cascade: true
      $.offices[*].addresses[*].state:
        type: text
        comment: State for the office location.
        cascade: true
      $.offices[*].addresses[*].postalCode:
        type: text
        comment: Postal code for the office location.
        cascade: true
      $.offices[*].addresses[*].country:
        type: text
        comment: Country for the office location.
        cascade: true
      $.offices[*].phones[*].type:
        type: select
        comment: Select the phone number type.
        options:
          values:
            - id: phone
              name: Phone
            - id: sms
              name: Text (SMS)
            - id: fax
              name: Fax
            - id: mobile
              name: Mobile
        cascade: true
      $.offices[*].phones[*].display:
        type: textarea
        comment: Display number format (e.g. "Call (413) 781-7646" or "Text (413) 781-7645").
        cascade: true
      $.offices[*].phones[*].href:
        type: text
        comment: Link format for the number (use "tel:" for calls and "sms:" for text numbers).
        cascade: true
      $.offices[*].officeHours[*].day:
        type: text
        comment: Day of the week for the office hours.
        cascade: true
      $.offices[*].officeHours[*].hours:
        type: text
        comment: Operating hours for the specified day.
        cascade: true
      $.offices[*].officeHours[*].note:
        type: text
        comment: Optional note shown with each office hour entry.
        cascade: true
      $.mapEmbedUrl:
        type: text
        comment: Site-level Google Maps embed URL fallback used when page/office map embeds are empty.
        cascade: true
      $.modals:
        type: array
        comment: Global modals rendered on every page (use IDs from fixed tab links).
        options:
          structures: _structures.siteModals
        cascade: true
      $.head_scripts:
        type: array
        comment: Scripts injected into the head. Add multiple entries as needed.
        cascade: true
      $.head_scripts[*]:
        type: textarea
        comment: A single script tag or script snippet for the head.
        cascade: true
      $.footer_scripts:
        type: array
