label:
  comment: Optional label for the button group to help identify it in the editor.
  type: text
buttonSections:
  type: array
  comment: Array of button components to render within the group.
  options:
    structures: _structures.buttonSections
direction:
  comment: Direction of button layout.
  type: select
  options:
    values:
      - id: row
        name: Row
      - id: column
        name: Column
alignX:
  comment: The horizontal alignment of the buttons within the group.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
width:
  comment: Whether the group stretches to fill its container, or shrinks to fit its buttons.
  type: select
  options:
    values:
      - id: full
        name: Full width
      - id: content
        name: Fit content

