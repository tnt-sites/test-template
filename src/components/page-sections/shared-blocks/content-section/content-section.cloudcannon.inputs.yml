_inputs:
  blocks:
    type: array
    comment: The column of content, rendered in this order.
    options:
      structures: _structures.content_section_block
  media:
    type: object
    comment: Optional rail beside the content — a photo, or the booking form.
    options:
      structures: _structures.content_section_media
  backgroundColor:
    type: color
  eyebrowColor:
    type: color
  headingColor:
    type: color
  textColor:
    type: color

_structures:
  content_section_block:
    id_key: type
    style: modal
    values:
      - label: Eyebrow
        icon: label
        value:
          type: eyebrow
          html: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: &content_section_block_types
                - id: eyebrow
                  name: Eyebrow
                - id: heading
                  name: Heading
                - id: subheading
                  name: Subheading
                - id: prose
                  name: Prose
                - id: list
                  name: List
                - id: image
                  name: Image
                - id: buttons
                  name: Buttons
                - id: cards
                  name: Cards
                - id: reviews
                  name: Reviews
          html:
            type: html
            label: Text
      - label: Heading
        icon: title
        value:
          type: heading
          html: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          html:
            type: html
            label: Heading
      - label: Subheading
        icon: subtitles
        value:
          type: subheading
          html: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          html:
            type: html
            label: Subheading
      - label: Prose
        icon: notes
        value:
          type: prose
          html: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          html:
            type: html
            label: Content
      - label: List
        icon: format_list_bulleted
        value:
          type: list
          html: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          html:
            type: html
            label: List
      - label: Image
        icon: image
        value:
          type: image
          source: ""
          alt: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          source:
            type: image
            label: Image
          alt:
            type: text
            label: Alt text
      - label: Buttons
        icon: smart_button
        value:
          type: buttons
          buttons:
            - text: ""
              link: ""
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          buttons:
            type: array
            options:
              structures: _structures.content_section_button
      - label: Cards
        icon: grid_view
        value:
          type: cards
          items:
            - title: ""
              text: ""
              buttons: []
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types
          items:
            type: array
            options:
              structures: _structures.content_section_card
      - label: Reviews
        icon: reviews
        description: The practice's Google reviews as a rotating slider.
        value:
          type: reviews
        _inputs:
          type:
            type: select
            comment: Which kind of block this is.
            options:
              values: *content_section_block_types

  content_section_button:
    values:
      - value:
          text: ""
          link: ""
        _inputs:
          text:
            type: text
          link:
            type: text

  content_section_card:
    values:
      - value:
          title: ""
          text: ""
          buttons: []
        _inputs:
          title:
            type: html
          text:
            type: html
          buttons:
            type: array
            options:
              structures: _structures.content_section_button

  content_section_media:
    id_key: type
    values:
      - label: Image
        icon: image
        value:
          type: image
          source: ""
          alt: ""
          side: right
        _inputs:
          type:
            type: select
            comment: Which kind of media rail this is.
            options:
              values: &content_section_media_types
                - id: image
                  name: Image
                - id: embed
                  name: Booking form
          source:
            type: image
            label: Image
          alt:
            type: text
            label: Alt text
          side:
            type: select
            options:
              values:
                - left
                - right
      - label: Booking form
        icon: assignment
        value:
          type: embed
          url: ""
          title: ""
          logo: ""
          side: right
          button:
            text: ""
            link: ""
        _inputs:
          type:
            type: select
            comment: Which kind of media rail this is.
            options:
              values: *content_section_media_types
          url:
            type: url
            label: Form URL
          title:
            type: text
            label: Heading
          logo:
            type: image
          side:
            type: select
            options:
              values:
                - left
                - right
          button:
            type: object
            options:
              structures: _structures.content_section_button
