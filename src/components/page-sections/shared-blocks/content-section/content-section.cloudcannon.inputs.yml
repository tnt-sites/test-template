blocks:
  type: array
  comment: The column of content, rendered in this order.
  options:
    structures: _structures.content_section_block
media:
  type: object
  comment: Optional rail beside the content — a photo, or the booking form.
  options:
    structures: _structures.content_section_media
align:
  type: select
  comment: Centre the eyebrow and heading over the column. Left-aligned when blank.
  options:
    values:
    - id: ''
      name: Left
    - id: center
      name: Centered
backgroundColor:
  type: select
  comment: Section background color.
  options:
    values: _select_data.brandColors
eyebrowColor:
  type: select
  comment: Eyebrow (kicker) text color.
  options:
    values: _select_data.brandColors
headingColor:
  type: select
  comment: Heading and subheading color.
  options:
    values: _select_data.brandColors
textColor:
  type: select
  comment: Body copy color.
  options:
    values: _select_data.brandColors
