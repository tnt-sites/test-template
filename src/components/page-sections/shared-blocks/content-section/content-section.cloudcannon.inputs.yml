_inputs:
  blocks:
    type: array
    comment: The section's content, in the order it renders.
    options:
      structures: _structures.content_block
  media:
    type: object
    comment: Optional photo or embed the copy wraps around.
    options:
      structures: _structures.content_media
  align:
    type: select
    comment: Centred reads as a page intro; left is a body section.
    options:
      values:
        - id: left
          name: Left
        - id: center
          name: Centred
  backgroundColor:
    type: color
    comment: Leave empty for a plain section; set it to make the section a band.
  headingColor:
    type: color
  subheadingColor:
    type: color
  textColor:
    type: color
  eyebrowColor:
    type: color

_structures:
  content_block:
    style: modal
    values:
      - label: Heading
        icon: title
        value:
          type: heading
          html: ""
        _inputs:
          type:
            type: hidden
          html:
            type: html
            options:
              bold: true
              italic: true
          level:
            type: number
            comment: 1 for the page title; leave empty for a normal section heading.
      - label: Subheading
        icon: subtitles
        value:
          type: subheading
          html: ""
        _inputs:
          type:
            type: hidden
          html:
            type: html
      - label: Prose
        icon: notes
        value:
          type: prose
          html: ""
          columns: 1
        _inputs:
          type:
            type: hidden
          html:
            type: markdown
          columns:
            type: select
            comment: Two columns suit a long list; copy should stay at one.
            options:
              values:
                - id: 1
                  name: One column
                - id: 2
                  name: Two columns
      - label: Divider
        icon: horizontal_rule
        value:
          type: divider
        _inputs:
          type:
            type: hidden
      - label: Eyebrow
        icon: short_text
        value:
          type: eyebrow
          html: ""
        _inputs:
          type:
            type: hidden
          html:
            type: html
      - label: Image
        icon: image
        value:
          type: image
          source: ""
          alt: ""
          side: right
        _inputs:
          type:
            type: hidden
          source:
            type: image
          alt:
            type: text
          side:
            type: select
            comment: Left/right float the photo beside the copy; center puts it on its own line.
            options:
              values:
                - id: left
                  name: Left
                - id: center
                  name: Center
                - id: right
                  name: Right
      - label: Logo row
        icon: view_week
        value:
          type: logos
          logos:
            - source: ""
              alt: ""
        _inputs:
          type:
            type: hidden
          logos:
            type: array
            comment: Small logos (payment, insurance) shown in one centered, wrapping row.
            options:
              structures: _structures.content_logo
      - label: FAQs
        icon: quiz
        value:
          type: faqs
          items:
            - question: ""
              answer: ""
        _inputs:
          type:
            type: hidden
          items:
            type: array
            comment: Questions shown as an accordion; each answer opens on click.
            options:
              structures: _structures.content_faq
      - label: Buttons
        icon: smart_button
        value:
          type: buttons
          buttons:
            - text: ""
              link: ""
              newTab: false
        _inputs:
          type:
            type: hidden
          buttons:
            type: array
            options:
              structures: _structures.content_button

  content_logo:
    values:
      - value:
          source: ""
          alt: ""
        _inputs:
          source:
            type: image
          alt:
            type: text
            comment: Name the logo, e.g. "Visa".
        preview:
          text:
            - key: alt
            - Logo
          image:
            - key: source

  content_faq:
    values:
      - value:
          question: ""
          answer: ""
        _inputs:
          question:
            type: text
          answer:
            type: html
        preview:
          text:
            - key: question
            - Question

  content_button:
    values:
      - value:
          text: ""
          link: ""
          newTab: false
        _inputs:
          text:
            type: text
          link:
            type: url
          newTab:
            type: switch
            label: Open in new tab

  content_media:
    values:
      - label: Photo
        icon: image
        value:
          type: image
          source: ""
          alt: ""
          side: right
        _inputs:
          type:
            type: hidden
          source:
            type: image
          alt:
            type: text
          side:
            type: select
            options:
              values:
                - id: left
                  name: Left
                - id: right
                  name: Right
      - label: Embed
        icon: dynamic_form
        value:
          type: embed
          url: ""
          title: ""
          side: right
        _inputs:
          type:
            type: hidden
          url:
            type: url
          title:
            type: text
          side:
            type: hidden
