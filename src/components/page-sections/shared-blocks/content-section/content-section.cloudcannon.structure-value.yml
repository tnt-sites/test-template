          type: text
          label: Icon
          comment: Name of an icon in src/icons, without the .svg (e.g. map, clock, phone). Leave blank for a plain card.
        title:
          type: html
        text:
          type: html
        buttons:
          type: array
          options:
            structures: _structures.content_section_button
  content_section_form_field:
    values:
    - value:
        name: ''
        label: ''
        type: text
        width: half
        required: false
      _inputs:
        name:
          type: text
          comment: The submitted field name. Derived from the label when blank.
        label:
          type: text
          comment: Shown as the placeholder, and read out as the field's accessible name.
        type:
          type: select
          options:
            values:
            - id: text
              name: Text
            - id: email
              name: Email
            - id: tel
              name: Phone
            - id: textarea
              name: Message box
        width:
          type: select
          comment: Half-width fields pair up; a message box always spans the row.
          options:
            values:
            - id: half
              name: Half
            - id: full
              name: Full
        required:
          type: switch

