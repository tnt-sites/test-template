_inputs:
  eyebrow:
    type: text
  heading:
    type: text
  sideMenuLinks:
    type: array
    label: Side Menu Links
    comment: Links shown in the side navigation column.
    options:
      structures: _structures.services_item
  buttonSections:
    type: array
    label: Buttons (Primary Categories)
    comment: Buttons for the top row of primary service categories.
    options:
      structures: _structures.buttonSections
  buttonSections2:
    type: array
    label: Buttons (Secondary Categories)
    comment: Buttons for the second row of service categories.
    options:
      structures: _structures.buttonSections
  sections:
    type: array
    label: Service Sections
    comment: Each service category block, in the order they appear on the page.
    options:
      structures: _structures.services_section
  eyebrowColor:
    type: color
  headingColor:
    type: color
  buttonTextColor:
    type: color
  textColor:
    type: color
  buttonBackgroundColor:
    type: color
  buttonTextColor2:
    type: color
  textColor2:
    type: color
  hoverBackgroundColor:
    type: color
  hoverBackgroundColor2:
    type: color
  hoverBackgroundColor3:
    type: color
  textHoverColor:
    type: color
  hoverColor:
    type: color
_structures:
  services_section:
    values:
      - label: Service Section
        icon: article
        value:
          heading: ""
          text: ""
          listHeading: ""
          links: []
          buttons: []
        preview:
          text:
            - key: heading
            - Service Section
          subtext:
            - key: listHeading
        _inputs:
          heading:
            type: text
            comment: Section title.
          text:
            type: html
            comment: Intro copy for this section.
          listHeading:
            type: text
            comment: Optional heading above the list of links.
          links:
            type: array
            comment: Links listed under this section. Split into two columns on desktop.
            options:
              structures: _structures.services_item
          buttons:
            type: array
            comment: Call-to-action button for this section.
            options:
              structures: _structures.buttonSections
  services_item:
    values:
      - label: Service Link
        icon: link
        value:
          buttonText: ""
          buttonLink: ""
        preview:
          text:
            - key: buttonText
            - Service Link
          subtext:
            - key: buttonLink
        _inputs:
          buttonText:
            type: text
          buttonLink:
            type: url
