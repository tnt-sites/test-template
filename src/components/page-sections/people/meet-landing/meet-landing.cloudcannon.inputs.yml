id:
  type: text
  comment: Optional ID so other pages can link straight to this section.
heading:
  type: markdown
  comment: Optional heading centered above the doctors.
  options:
    bold: false
    italic: true
    link: false
    format: p
    styles: /.cloudcannon/styles/editor.css
doctors:
  type: array
  label: Doctors
  comment: One card per doctor, four to a row on desktop.
  options:
    structures: _structures.meetLandingPeople
background:
  type: select
  comment: Section background.
  options:
    values:
      - id: white
        name: White
      - id: cream
        name: Cream
      - id: navy
        name: Navy
      - id: green
        name: Green
