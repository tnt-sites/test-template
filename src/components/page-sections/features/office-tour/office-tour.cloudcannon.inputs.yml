heading:
  type: markdown
  comment: Heading centered above the slides.
  options:
    bold: false
    italic: true
    link: false
    format: p
    styles: /.cloudcannon/styles/editor.css
tourSlides:
  type: array
  comment: Photos in the tour, one per slide. Photos are cropped to the same landscape shape.
  options:
    structures: _structures.tourSlides
background:
  type: select
  comment: Section background.
  options:
    values:
      - id: white
        name: White
      - id: cream
        name: Cream
      - id: navy
        name: Navy
      - id: green
        name: Green
