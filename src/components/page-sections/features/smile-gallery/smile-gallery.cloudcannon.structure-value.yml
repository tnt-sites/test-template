_structures:
  gallerySlides:
    values:
      - label: Before & After
        icon: compare
        value:
          _component: page-sections/features/smile-gallery/gallery-slide
          combinedImage: ""
          combinedAlt: ""
          beforeImage: ""
          beforeAlt: ""
          beforeLabel: Before
          afterImage: ""
          afterAlt: ""
          afterLabel: After
          caption: ""
        preview:
          text:
            - key: caption
            - Before & After
          image:
            - key: afterImage
        _inputs:
          combinedImage:
            type: image
            comment: A single prepared image with before and after side by side (labels included). When set, the separate before/after photos below are ignored.
            options:
              paths:
                uploads: src/assets/images
                static: ""
          combinedAlt:
            type: text
            comment: Describe the before and after for screen readers, e.g. "Gapped teeth before and after braces".
          beforeImage:
            type: image
            comment: Photo before treatment. Cropped to a landscape shape (about 8:5).
            options:
              paths:
                uploads: src/assets/images
                static: ""
          beforeAlt:
            type: text
            comment: Describe the before photo for screen readers.
          beforeLabel:
            type: text
            comment: Label under the before photo.
          afterImage:
            type: image
            comment: Photo after treatment. Cropped to the same shape as the before photo.
            options:
              paths:
                uploads: src/assets/images
                static: ""
          afterAlt:
            type: text
            comment: Describe the after photo for screen readers.
          afterLabel:
            type: text
            comment: Label under the after photo.
          caption:
            type: textarea
            comment: Optional italic caption under the pair, e.g. the treatment used.
