eyebrow:
  type: text
  comment: Small H1 above the main heading (e.g. "Dentist in Wheat Ridge").
heading:
  type: text
  comment: Large H2 welcome heading.
text:
  type: markdown
  comment: Intro paragraph under the heading. Links show in orange.
  options:
    bold: true
    italic: true
    link: true
    format: p
imageSource:
  type: image
  comment: Full-width banner photo.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text for the banner photo.
buttonSections:
  type: array
  comment: Button shown at the bottom right of the banner.
  options:
    structures: _structures.buttonSections
