id:
  type: text
  comment: Optional HTML id attribute for this component.
eyebrow:
  type: text
  comment: Small uppercase line shown above the main heading.
heading:
  type: markdown
  comment: Main heading text for the component. Supports inline span wrappers/classes for highlighted words.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
quickLinks:
  type: array
  label: Quick Links
  comment: Row of quick links shown below the heading.
  options:
    structures:
      values:
        - label: Link
          value:
            text: Link Text
            href: /
badgeSource:
  type: image
  comment: Badge image overlapping the top-right of the hero photo.
  options:
    paths:
      uploads: src/assets/images
      static: ""
badgeAlt:
  type: text
  comment: Alt text for the badge image.
thumbnailSource:
  type: image
  comment: Main hero photo.
  options:
    paths:
      uploads: src/assets/images
      static: ""
thumbnailAlt:
  type: text
  comment: Alt text for the main hero photo.
backgroundGradient:
  type: textarea
  comment: Optional CSS gradient applied behind the section content.
backgroundImage:
  type: object
  comment: Background image configuration for the section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
# Add your other component inputs here
# Example:
# text:
#   type: text
#   comment: The text content for the component.
