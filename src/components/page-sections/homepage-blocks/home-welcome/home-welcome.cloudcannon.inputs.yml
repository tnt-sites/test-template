id:
  type: text
  comment: Optional HTML id attribute for this component.
eyebrow:
  type: text
  comment: Kicker line overlaid on the photo.
image:
  type: image
  comment: Photo displayed above the accordion.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alt text for the photo.
items:
  type: array
  label: Accordion Items
  comment: One-at-a-time accordion items overlapping the bottom of the photo.
  options:
    structures: _structures.homeWelcomeItems
