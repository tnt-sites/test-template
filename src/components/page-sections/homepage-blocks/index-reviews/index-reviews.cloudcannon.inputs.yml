id:
  type: text
  comment: Optional HTML id attribute for this component.
heading:
  type: markdown
  comment: Optional heading above the reviews. The design leaves it blank.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
reviews:
  type: array
  label: Reviews
  comment: Patient reviews, one per slide. Include the quotation marks in the text.
  options:
    structures: _structures.reviewItems
buttonSections:
  type: array
  comment: Button beside the dots, e.g. "Read More Reviews".
  options:
    structures: _structures.buttonSections
background:
  type: select
  comment: Section background. Cream continues the band from the results section above.
  options:
    values:
      - id: cream
        name: Cream
      - id: white
        name: White
      - id: navy
        name: Navy
