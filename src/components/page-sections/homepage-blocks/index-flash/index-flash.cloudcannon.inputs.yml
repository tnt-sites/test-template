id:
  type: text
  comment: Optional HTML id attribute for this component.
cards:
  type: array
  label: Flash Cards
  comment: Frosted-glass cards; hovering a card swaps the section's background photo.
  options:
    structures:
      values:
        - label: Card
          value:
            heading: Card Heading
            text: Card description text.
            buttonText: Tell Me More
            href: /
            backgroundSource: ""
backgroundGradient:
  type: textarea
  comment: Optional CSS gradient applied behind the section content.
backgroundImage:
  type: object
  comment: Background image configuration for the section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
