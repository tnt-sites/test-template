id:
  type: text
  comment: Optional ID so other pages can link straight to this section, e.g. "services".
services:
  type: array
  comment: Service cards, three per row on desktop.
  options:
    structures: _structures.servicesGridItems
background:
  type: select
  comment: Section background. Cream matches the design.
  options:
    values:
      - id: cream
        name: Cream
      - id: white
        name: White
      - id: navy
        name: Navy
      - id: green
        name: Green
backgroundGradient:
  type: textarea
  comment: "Optional CSS gradient applied behind the section content."
