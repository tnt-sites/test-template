label: Services Grid
icon: apps
description: Grid of service cards, each with an icon in a circle, a title linking to the service page, and a checklist of links.
value:
  _component: page-sections/ctas/services-grid
  id: ""
  background: cream
  backgroundGradient: ""
  services:
    - _component: page-sections/ctas/services-grid/services-grid-item
      icon: checkup
      title: I Need a Checkup & Cleaning
      href: /preventive-dentistry/
      links:
        - _component: page-sections/ctas/services-grid/service-link
          label: Dental Checkups & Cleanings
          href: /preventive-dentistry/#checkups
preview:
  text:
    - Services Grid
  icon: apps
picker_preview:
  text: Services Grid
  subtext: Service cards with icons and link checklists.
_inputs_from_glob:
  - /src/components/page-sections/ctas/services-grid/services-grid.cloudcannon.inputs.yml
_structures:
  servicesGridItems:
    values:
      - label: Service Card
        icon: list
        value:
          _component: page-sections/ctas/services-grid/services-grid-item
          icon: checkup
          title: Service title
          href: ""
          links:
            - _component: page-sections/ctas/services-grid/service-link
              label: Service detail link
              href: ""
        preview:
          text:
            - key: title
            - Service Card
          subtext:
            - key: href
          icon: list
        _inputs:
          icon:
            type: select
            comment: Icon shown in the circle at the top of the card.
            options:
              values:
                - id: checkup
                  name: Tooth with check (checkups)
                - id: child
                  name: Child (children’s dentistry)
                - id: crown
                  name: Tooth with crown (restorative)
                - id: implant
                  name: Implant (missing teeth)
                - id: cosmetic
                  name: Sparkling tooth (cosmetic)
                - id: aligners
                  name: Aligners (straighter smile)
                - id: jaw
                  name: Jaw profile (TMJ)
                - id: sleep
                  name: Moon (sleep)
                - id: emergency
                  name: Tooth with plus (emergency)
          title:
            type: markdown
            comment: Card heading. Use a line break to control where it wraps.
            options:
              bold: false
              italic: false
              link: false
          href:
            type: url
            comment: Page the card heading links to.
          links:
            type: array
            comment: Checklist of links under the heading, usually to sections of the service page.
            options:
              structures: _structures.servicesGridLinks
  servicesGridLinks:
    values:
      - label: Service Link
        icon: link
        value:
          _component: page-sections/ctas/services-grid/service-link
          label: Link label
          href: ""
        preview:
          text:
            - key: label
            - Service Link
          subtext:
            - key: href
        _inputs:
          label:
            type: text
            comment: Text shown next to the check mark.
          href:
            type: url
            comment: Page or section this links to, e.g. /preventive-dentistry/#checkups.
