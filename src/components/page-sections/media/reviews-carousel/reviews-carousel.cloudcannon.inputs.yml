label:
  comment: Optional label for the carousel to help identify it in the editor.
  type: text
reviews:
  comment: The patient testimonials shown in the slider.
  type: array
  options:
    structures: _structures.reviews
cardWidth:
  comment: Width of each testimonial card in pixels. The source site uses 600.
  type: number
slidePitch:
  comment: Distance between card centres in pixels. Anything above the card width
    leaves the neighbouring cards partly in view. The source site uses 640.
  type: number
rating:
  comment: How many stars to show above each title, from 0 to 5.
  type: number
quoteIcon:
  comment: The speech-bubble icon shown beside each testimonial. Leave empty to hide it.
  type: image
starIcon:
  comment: The single star image, repeated for the rating.
  type: image
showIndicators:
  comment: Show the dot indicators beneath the slider.
  type: switch
showArrows:
  comment: Show previous/next arrows. The source site uses dots only.
  type: switch
autoPlay:
  comment: Advance the slider automatically every five seconds.
  type: switch
