_structures:
  video_service_list_service:
    values:
      - value:
          icon: whitening
          title: ""
          text: ""
        _inputs:
          icon:
            type: select
            comment: Illustration shown beside this service.
            options:
              values:
                - id: whitening
                  name: Whitening
                - id: detox
                  name: Detox
                - id: chaser
