_inputs:
  eyebrow:
    type: text
    comment: Small uppercase label above the heading.
  heading:
    type: html
  text:
    type: textarea
    label: Intro
    comment: Introductory paragraph shown under the heading, above the service list.
  poster:
    type: image
    label: Video Poster
    comment: Still shown in the video frame before playback. Decorative — the play button carries the label.
    options:
      paths:
        uploads: src/assets/images
        static: ""
  videoSource:
    type: file
    label: Video Source
    comment: Video played in the modal. Must be mp4 so every modern browser can play it. Leave empty to show the poster with no play button.
    options:
      accepts_mime_types:
        - video/mp4
      paths:
        uploads: public/videos
        static: public
  services:
    type: array
    comment: The services listed beside the video.
    options:
      structures: _structures.video_service_list_service
  backgroundColor:
    type: select
    comment: Background colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  backgroundColorHex:
    type: color
    comment: Optional custom hex that overrides the backgroundColor selection.
  eyebrowColor:
    type: select
    comment: Eyebrow colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
