_inputs:
  poster:
    type: image
    comment: Still shown in the video frame before playback. Decorative — the play button carries the label.
    options:
      paths:
        uploads: src/assets/images
        static: ""
  eyebrow:
    type: text
  heading:
    type: html
  text:
    type: text
  text2:
    type: html
  text3:
    type: text
  text4:
    type: textarea
  subheading:
    type: html
  text5:
    type: textarea
