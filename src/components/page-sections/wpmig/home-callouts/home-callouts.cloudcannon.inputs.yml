_inputs:
  cards:
    type: array
    options:
      structures: _structures.why_choose_us_item
  titleColor:
    type: select
    comment: Title colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  titleColorHex:
    type: color
    comment: Optional custom hex that overrides the titleColor selection.
  hoverColor:
