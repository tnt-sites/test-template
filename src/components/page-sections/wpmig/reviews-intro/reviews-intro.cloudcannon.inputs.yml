_inputs:
  backgroundImage:
    type: image
    comment: Photo behind the panel. Painted as the background, so it needs no alt text.
    options:
      paths:
        uploads: src/assets/images
        static: ""
  eyebrow:
    type: text
  heading:
    type: html
  text:
    type: html
  eyebrowColor:
    type: select
    comment: Eyebrow colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  eyebrowColorHex:
    type: color
    comment: Optional custom hex that overrides the eyebrowColor selection.
  headingColor:
    type: select
    comment: Heading colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  headingColorHex:
    type: color
    comment: Optional custom hex that overrides the headingColor selection.
  textColor:
    type: select
    comment: Text colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  textColorHex:
    type: color
    comment: Optional custom hex that overrides the textColor selection.
