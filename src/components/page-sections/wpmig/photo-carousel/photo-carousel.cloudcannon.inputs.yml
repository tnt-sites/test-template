_inputs:
  heading:
    type: text
  text:
    type: textarea
  text2:
    type: textarea
  text3:
    type: textarea
  image:
    type: image
  imageAlt:
    type: text
  subheading:
    type: text
  text4:
    type: html
  items:
    type: array
    label: Office tour slides
    comment: The photos the slideshow steps through.
    options:
      structures: _structures.media_prose_b_item
  autoPlay:
    type: switch
    comment: Advance the slideshow on its own.
  interval:
    type: number
    comment: Milliseconds each slide holds before the next.
  backgroundColor:
    type: select
    comment: Background colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  backgroundColorHex:
    type: color
    comment: Optional custom hex that overrides the backgroundColor selection.
  headingColor:
    type: select
    comment: Heading colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  headingColorHex:
    type: color
    comment: Optional custom hex that overrides the headingColor selection.
  textColor:
    type: select
    comment: Text colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
          name: Brand (Tertiary)
        - id: var(--color-brand-subtle)
          name: Brand (Subtle)
        - id: var(--color-text-on-brand)
          name: Text on Brand
        - id: var(--color-link)
          name: Link
        - id: var(--color-link-hover)
          name: Link Hover
        - id: "#ffffff"
          name: White
        - id: "#1a1a1a"
          name: Dark
        - id: "#000000"
          name: Black
  textColorHex:
    type: color
    comment: Optional custom hex that overrides the textColor selection.
_structures:
  media_prose_b_item:
    values:
      - label: Slide
        icon: image
        value:
          image: ""
          imageAlt: ""
        _inputs:
          image:
            type: image
          imageAlt:
            type: text
