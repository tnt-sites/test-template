_structures:
  media_prose_blocks:
    values:
      - label: Heading
        icon: title
        value: { type: heading, level: h3, text: "" }
      - label: Eyebrow
        icon: short_text
        value: { type: eyebrow, text: "" }
      - label: Rich text
        icon: notes
        value: { type: text, text: "" }
      - label: List
        icon: format_list_bulleted
        value: { type: list, ordered: false, items: [] }
      - label: Image
        icon: image
        value: { type: image, image: "", imageAlt: "" }
      - label: Embed
        icon: smart_display
        value: { type: embed, embedUrl: "", title: "" }
      - label: Button
        icon: smart_button
        value: { type: button, buttonText: "", buttonLink: "" }

_inputs:
  layout:
    type: select
    comment: >-
      stack = one centred column; split = prose plus a contact rail;
      cards = intro blocks above a card grid.
    options:
      values:
        - id: stack
          name: Stack (single column)
        - id: split
          name: Split (prose + rail)
        - id: cards
          name: Cards (intro + grid)
  width:
    type: select
    comment: Maximum content width.
    options:
      values:
        - id: narrow
          name: Narrow (767px)
        - id: wide
          name: Wide (1024px)
        - id: full
          name: Full width
  align:
    type: select
    comment: Text alignment for the main column.
    options:
      values:
        - id: ""
          name: Left (default)
        - id: center
          name: Centred
  padded:
    type: checkbox
    comment: Adds 10px of horizontal padding to the section shell.
  cardStyle:
    type: select
    comment: Card layout, used when layout is "cards".
    options:
      values:
        - id: caption
          name: Caption (title, text, then image)
        - id: title-first
          name: Title first
        - id: media-first
          name: Image first
  blocks:
    type: array
    comment: The main column content, in order.
    options:
      structures: _structures.media_prose_blocks
  rail:
    type: array
    comment: The right-hand rail, used when layout is "split".
    options:
      structures: _structures.media_prose_blocks
  cards:
    type: array
    comment: Cards, used when layout is "cards".
  backgroundColor:
    type: select
    comment: Background colour, from the site palette.
    options:
      values:
        - id: ""
          name: Default
        - id: var(--color-brand)
          name: Brand (Primary)
        - id: var(--color-brand-secondary)
          name: Brand (Secondary)
        - id: var(--color-brand-muted)
