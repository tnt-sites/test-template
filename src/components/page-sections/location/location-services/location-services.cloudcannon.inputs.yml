id:
  type: text
  comment: Optional HTML id for this section, for anchor links.
backgroundColor:
  type: select
  comment: Override this section's background color. Leave blank to use the default.
  options:
    values: _select_data.locationBackgroundColors
headingColor:
  type: select
  comment: Override this section's heading color (and the caption under an icon). Leave blank to use the default.
  options:
    values: _select_data.locationTextColors
textColor:
  type: select
  comment: Override this section's paragraph and link color. Leave blank to use the default.
  options:
    values: _select_data.locationTextColors
heading:
  type: text
  comment: Section heading.
intro:
  type: markdown
  comment: Introductory paragraph shown above the cards.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: true
    numberedlist: true
    styles: /.cloudcannon/styles/editor.css
services:
  type: array
  label: Services
  comment: Photo cards, each opening a pop-up describing that service.
  options:
    structures: _structures.locationServices
