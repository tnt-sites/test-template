heading:
  type: text
  comment: Page heading, e.g. "ADA Efforts".
intro:
  type: markdown
  comment: Opening paragraph explaining the practice's approach to ADA compliance.
measuresTitle:
  type: text
  comment: Heading above the list of ongoing measures.
measures:
  type: array
  comment: The concrete steps taken. Add to this list as work is completed.
  options:
    structures: _structures.adaEffortsMeasures
measureIcon:
  type: text
  comment: >-
    Icon shown beside each measure. Fontello names from the source site work
    verbatim, e.g. "icon-ok-1". Leave blank for no icon.
standardsTitle:
  type: text
  comment: Heading for the standards block.
standardsBody:
  type: markdown
  comment: Which standards and guidelines the practice works to.
contactTitle:
  type: text
  comment: Heading for the contact block.
contactBody:
  type: markdown
  comment: How to raise an accessibility concern.
siteInfo:
  hidden: true
  comment: Falls back to src/data/siteInfo.json so contact details match the footer.
backgroundColor:
  type: select
  comment: Background color used behind the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundGradient:
  type: textarea
  comment: Optional CSS gradient applied behind the section content.
backgroundImage:
  type: object
  comment: Background image configuration for the section.
backgroundImage.source:
  type: image
  comment: URL or path to the background image.
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  type: textarea
  comment: Alt text for the background image.
backgroundImage.positionVertical:
  type: select
  comment: Vertical position of the background image.
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  type: select
  comment: Horizontal position of the background image.
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
