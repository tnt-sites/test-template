heading:
  type: markdown
  comment: Section heading displayed above the emergency items.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
anchorName:
  type: text
  comment: Optional anchor so links can jump to this section, e.g. "most" for /emergency-dentistry/#most.
subtext:
  type: text
  comment: Subtext displayed under the heading.
backgroundImage:
  type: object
  comment: Background image configuration for the section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
emergencyItems:
  type: array
  label: Emergency Items
  comment: Cards shown in the emergency grid.
  options:
    structures: _structures.emergencyItems
enableModals:
  type: switch
  comment: Enable pop-up dialogs for items with modal content.
background:
  type: select
  comment: Section background.
  options:
    values:
      - id: white
        name: White
      - id: cream
        name: Cream
      - id: navy
        name: Navy
      - id: green
        name: Green
showHeadingBar:
  type: switch
  comment: Show the thin bar under the heading.
backgroundGradient:
  type: textarea
  comment: "Optional CSS gradient applied behind the section content."
