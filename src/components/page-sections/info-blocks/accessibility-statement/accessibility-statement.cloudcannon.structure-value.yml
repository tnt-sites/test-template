label: Accessibility Statement
icon: accessibility
description: Accessibility statement with conformance status and a feedback contact.
value:
  _component: page-sections/info-blocks/accessibility-statement
  heading: Accessibility Statement
  intro: >-
    R2 Center for Dentistry is committed to making our website usable by as many
    people as possible, including patients who use assistive technology such as
    screen readers, screen magnifiers, or keyboard-only navigation.
  conformanceTitle: Conformance Status
  conformanceBody: >-
    The [Web Content Accessibility Guidelines (WCAG)](https://www.w3.org/WAI/standards-guidelines/wcag/)
    define requirements for making web content more accessible to people with
    disabilities. We aim to meet WCAG 2.1 Level AA.


    This website is **partially conformant** with WCAG 2.1 Level AA. Partially
    conformant means that some parts of the content do not yet fully meet the
    standard. We are working to identify and correct those areas.
  sections:
    - title: What We Have Done
      body: >-
        - Text and background colours are checked for sufficient contrast.

        - Images that convey information carry descriptive alternative text.

        - The site can be navigated using a keyboard alone, and visible focus
          styles show which element is selected.

        - Headings, lists, and landmarks are used so screen readers can move
          through a page in a meaningful order.

        - The layout adapts to different screen sizes and to increased browser
          text size without loss of content.
    - title: Known Limitations
      body: >-
        Despite our efforts, some limitations remain. Content supplied by third
        parties — including embedded maps, review feeds, and appointment
        booking tools — is not under our direct control and may not fully meet
        WCAG 2.1 Level AA. If any of this content prevents you from completing
        a task, please contact us and we will provide the information or
        service another way.
  feedbackTitle: Tell Us About a Problem
  feedbackBody: >-
    If you encounter a barrier on this site, or need information in a different
    format, please get in touch. Tell us the page address and what happened, and
    we will respond as quickly as we can and arrange another way to help you in
    the meantime.
  lastUpdated: ""
  backgroundColor: none
  backgroundGradient: ""
  backgroundImage:
    source: ""
    alt: ""
    positionVertical: top
    positionHorizontal: center
