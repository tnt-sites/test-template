heading:
  type: markdown
  comment: Main heading for the FAQ section.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
singleOpen:
  type: switch
  comment: Close the open question when another one is opened.
openFirst:
  type: switch
  comment: Show the first answer open when the page loads.
items:
  type: array
  label: FAQ Items
  comment: Questions and answers in the accordion.
  options:
    structures: _structures.faqItems
background:
  type: select
  comment: Section background.
  options:
    values:
      - id: white
        name: White
      - id: cream
        name: Cream
      - id: navy
        name: Navy
      - id: green
        name: Green
