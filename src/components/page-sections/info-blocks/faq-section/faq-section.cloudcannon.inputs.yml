heading:
  type: markdown
  comment: Main heading for the FAQ section.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
headingLevel:
  type: select
  comment: HTML heading level (h1-h6).
  options:
    values:
      - id: h1
        name: H1
      - id: h2
        name: H2
      - id: h3
        name: H3
      - id: h4
        name: H4
      - id: h5
        name: H5
      - id: h6
        name: H6
headingSize:
  type: select
  comment: Visual size of the heading.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2X Large
singleOpen:
  type: switch
  comment: Whether only one accordion item can be open at a time.
openFirst:
  type: switch
  comment: Whether the first accordion item should be open by default.
iconName:
  type: text
  comment: >-
    Icon shown at the end of each title bar. Empty renders no icon — the source
    accordions this was migrated from use the title-bar colour change as the
    only open/closed cue.
items:
  type: array
  label: FAQ Items
  comment: Questions and answers in the accordion.
  options:
    structures: _structures.faqItems
maxContentWidth:
  type: select
  comment: Maximum width of the content area.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2X Large
paddingHorizontal:
  type: select
  comment: Horizontal padding for the section.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
paddingVertical:
  type: select
  comment: Vertical padding for the section.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2X Large
      - id: 3xl
        name: 3X Large
      - id: 4xl
        name: 4X Large
colorScheme:
  type: select
  comment: Color scheme theme applied to the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: default
        name: Default
      - id: contrast
        name: Contrast
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.
backgroundGradient:
  type: textarea
  comment: "Optional CSS gradient applied behind the section content."
backgroundImage:
  type: object
  comment: Background image configuration for the section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
accordionTheme:
  type: object
  label: Accordion Design
  comment: >-
    Measured styling for the panels, filled in by the migrator from the source
    site. Leave empty to use the theme's own accordion design.
  options:
    preview:
      icon: palette
      text:
        - Accordion Design
      subtext:
        - key: titleBackground
        - Theme default
accordionTheme.titleBackground:
  type: color
  comment: Fill behind a closed panel's title bar.
accordionTheme.titleColor:
  type: color
  comment: Text colour of a closed panel's title bar.
accordionTheme.titleBackgroundOpen:
  type: color
  comment: Fill behind the open panel's title bar.
accordionTheme.titleColorOpen:
  type: color
  comment: Text colour of the open panel's title bar.
accordionTheme.titleFontSize:
  type: text
  comment: "CSS length for the title text, e.g. 18px."
accordionTheme.titleFontWeight:
  type: text
  comment: "CSS font weight for the title text, e.g. 400."
accordionTheme.titlePadding:
  type: text
  comment: "CSS padding shorthand for the title bar, e.g. 15px."
accordionTheme.titleGap:
  type: text
  comment: Space between the title text and its icon.
accordionTheme.itemGap:
  type: text
  comment: Space between one panel and the next.
accordionTheme.itemBorder:
  type: text
  comment: "CSS border shorthand under each panel. Empty keeps the theme's hairline rule."
accordionTheme.detailPadding:
  type: text
  comment: CSS padding shorthand for an open panel's content.
accordionTheme.detailBorderTop:
  type: text
  comment: CSS border shorthand above an open panel's content.
accordionTheme.detailBorderBottom:
  type: text
  comment: CSS border shorthand below an open panel's content.
accordionTheme.detailBackground:
  type: color
  comment: Fill behind an open panel's content.
accordionTheme.detailBorderRight:
  type: text
  comment: CSS border shorthand on an open panel's right edge.
accordionTheme.detailBorderLeft:
  type: text
  comment: CSS border shorthand on an open panel's left edge.
