serviceCenter:
  template: mdx_component
  inline: false
  preview:
    text:
      - Service Center
    subtext:
      - key: heading
    icon: hero
  definitions:
    component_name: ServiceCenter
    named_args:
      - editor_key: anchorName
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: buttonSections
        type: array
        optional: true
      - editor_key: background
        type: string
        optional: true
        remove_empty: true
      - editor_key: showHeadingBar
        type: boolean
        optional: true
  _inputs_from_glob:
    - /src/components/page-sections/services/service-center/service-center.cloudcannon.inputs.yml
