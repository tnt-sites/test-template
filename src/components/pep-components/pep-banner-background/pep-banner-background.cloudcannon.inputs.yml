backgroundColor:
  type: select
  comment: Background color of the banner section. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

borderColor:
  type: select
  comment: Color of the bottom border stripe. Leave blank to use the default brand color.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-accent)"
        name: Accent
      - id: "#000000"
        name: Black
      - id: "#ffffff"
        name: White

headingColor:
  type: select
  comment: Color of the H1 heading text. Leave blank to use the theme default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

textColor:
  type: select
  comment: Color of the body copy. Leave blank to inherit the component default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

heading:
  type: text
  comment: Main H1 heading. Supports <br> for manual line breaks.

headingFontFamily:
  type: text
  comment: Override the font family for this heading. Leave blank to use the site default. Use any font family loaded by the page, including extra fonts.

text:
  type: markdown
  comment: Body copy shown over the banner. Supports bold, italic, and links.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false

dividerColor:
  type: select
  comment: Color of the horizontal rule below the text. Leave blank to use the default brand color.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-accent)"
        name: Accent
      - id: "#000000"
        name: Black
      - id: "#ffffff"
        name: White

image:
  type: object
  comment: Main banner image shown on desktop.
  _inputs:
    source:
      type: image
      comment: Desktop banner image.
      options:
        paths:
          uploads: src/assets/images
          static: ""
    alt:
      type: textarea
      comment: Alt text describing the banner image for accessibility.

HeadingSpanColor:
  type: select
  comment: Color of the h1 span text. Leave blank to inherit the heading color.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

AccentWordColor:
  type: select
  comment: Color of the accented word inside the h1 span. Leave blank to use the brand color.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
