backgroundColor:
  type: select
  comment: Background color of the outer section (behind the card grid).
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

headingBackgroundColor:
  type: select
  comment: Background color of the h2 heading banner. Defaults to brand secondary.
  options:
    values:
      - id: ""
        name: Default (Brand Secondary)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "#000000"
        name: Black
      - id: "#ffffff"
        name: White

headingBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the h2 background. Overrides the dropdown above.

headingTextColor:
  type: select
  comment: Text color of the h2 heading.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

oddItemBackgroundColor:
  type: select
  comment: Background color for odd-numbered callout items (1st, 3rd, 5th…). Defaults to a subtle tint.
  options:
    values:
      - id: ""
        name: Default (Subtle Tint)
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "#ffffff"
        name: White
      - id: "transparent"
        name: Transparent

oddItemBackgroundColorHex:
  type: color
  comment: Optional custom hex color for odd items. Overrides the dropdown above.

evenItemBackgroundColor:
  type: select
  comment: Background color for even-numbered callout items (2nd, 4th, 6th…). Defaults to white.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "#ffffff"
        name: White
      - id: "transparent"
        name: Transparent

evenItemBackgroundColorHex:
  type: color
  comment: Optional custom hex color for even items. Overrides the dropdown above.

itemHeadingColor:
  type: select
  comment: Color of each item's h3 label text.
  options:
    values:
      - id: ""
        name: Default (Dark)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

heading:
  type: text
  comment: Section heading displayed in the colored banner above the grid. Supports HTML (e.g. <br>).

items:
  type: array
  comment: List of callout items, each with an icon image and a short label.
  options:
    structures:
      values:
        - label: Callout Item
          icon: image
          value:
            image:
              source: https://placehold.co/200x110
              alt: Callout icon
            heading: Callout Heading

items[*].image.source:
  type: image

items[*].image.alt:
  type: text
  comment: Alt text for the callout icon image.

items[*].heading:
  type: text
  comment: Short label displayed below the image. Supports <br> for line breaks.
