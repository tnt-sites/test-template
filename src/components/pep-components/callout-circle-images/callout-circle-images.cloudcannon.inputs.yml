backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

headingColor:
  type: select
  comment: Color of the section heading.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

itemHeadingColor:
  type: select
  comment: Color of each callout item's heading text.
  options:
    values:
      - id: ""
        name: Default (Dark)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

circleBackgroundColor:
  type: select
  comment: Background color of the circular image container.
  options:
    values:
      - id: ""
        name: Default (Surface)
      - id: "var(--color-bg-surface)"
        name: Surface (Light Gray)
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "transparent"
        name: Transparent

heading:
  type: text
  comment: Section heading displayed above the callout items. Supports HTML (e.g. <br> for line breaks).

items:
  type: array
  comment: List of callout items, each with a circle image and a short heading.
  options:
    structures:
      values:
        - label: Callout Item
          icon: image
          value:
            image:
              source: https://placehold.co/400x400
              alt: Callout image
            heading: Callout Heading

items[*].image.source:
  type: image

items[*].image.alt:
  type: text
  comment: Alt text for the callout image.

items[*].heading:
  type: text
  comment: Short label displayed below the image. Supports <br> for line breaks.
