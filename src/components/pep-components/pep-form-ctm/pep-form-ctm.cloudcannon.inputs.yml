backgroundColor:
  type: select
  comment: Background color of the outer section (the band behind the content card).
  options:
    values:
      - id: ""
        name: None
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color for the outer section background. Overrides the dropdown above.

contentBackgroundColor:
  type: select
  comment: Background color of the inner content card (behind the form).
  options:
    values:
      - id: ""
        name: Default
      - id: ""
        name: None (Transparent)
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black

contentBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the inner content card. Overrides the dropdown above.

callBackgroundColor:
  type: select
  comment: Background color of the call-to-action row (photo + call text).
  options:
    values:
      - id: ""
        name: Default
      - id: ""
        name: None (Transparent)
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black

callBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the call row background. Overrides the dropdown above.

callTextColor:
  type: select
  comment: Color of the call text.
  options:
    values:
      - id: ""
        name: Default (Dark)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

linkColor:
  type: select
  comment: Color of the phone number link.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "#95982d"
        name: Olive Green

image:
  type: object
  comment: Photo displayed beside the call text (typically a team or doctor photo).

image.source:
  type: image
  comment: URL or path of the call-row photo.

image.alt:
  type: text
  comment: Alt text for the call-row photo.

figcaption:
  type: text
  comment: Caption overlaid at the bottom of the photo (e.g. doctor names). Leave blank to hide.

callText:
  type: html
  comment: Full call-to-action text displayed in the call row next to the photo. Supports links, line breaks, and inline formatting.

iframeEmbed:
  type: textarea
  comment: Raw HTML embed code from CTM. Paste the full iframe and/or script tags here.

bottomText:
  type: markdown
  comment: Optional paragraph displayed below the form in the outer section background color. Supports HTML.
