backgroundColor:
  type: select
  comment: Background color of the banner section. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

backgroundImage:
  type: file
  comment: Optional background image asset for the banner. Image will be set to no-repeat and centered.
  accepts:
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg

backgroundPositionX:
  type: text
  comment: Horizontal position of the background image (e.g., 'center', '50%', '271px').

backgroundPositionY:
  type: text
  comment: Vertical position of the background image (e.g., '80%', 'center', '100px').

boxShadow:
  type: boolean
  comment: Optional box shadow for the banner..

topBorder:
  type: boolean
  comment: Show a thin border at the top of the banner.

borderColor:
  type: select
  comment: Color of the bottom border stripe. Leave blank to use the default brand color.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-accent)"
        name: Accent
      - id: "#000000"
        name: Black
      - id: "#ffffff"
        name: White

headingColor:
  type: select
  comment: Color of the H1 heading text. Leave blank to use the theme default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

dividerColor:
  type: select
  comment: Color of the short divider under the heading. Leave blank to match the heading color.
  options:
    values:
      - id: ""
        name: Default (Match Heading)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

textColor:
  type: select
  comment: Color of the body copy. Leave blank to inherit the component default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

paddingVertical:
  type: select
  comment: The space on the top and bottom of this section.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl

heading:
  type: text
  comment: Main H1 heading. Supports <br> for manual line breaks.

headingFontFamily:
  type: text
  comment: Override the font family for this heading. Leave blank to use the site default. Use any font family loaded by the page, including extra fonts.

contentStyle:
  type: select
  comment: Choose whether this banner shows paragraph text or a checklist with oversized checkmarks.
  options:
    values:
      - id: paragraph
        name: Paragraph
      - id: checklist
        name: Checklist

showDivider:
  type: switch
  comment: Show the short rule under the heading.

text:
  type: markdown
  comment: Centered body copy shown below the heading when Content Style is Paragraph.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false

listItems:
  type: array
  comment: Checklist items shown when Content Style is Checklist.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

listItems[*]:
  type: text
  comment: Single checklist line. Supports simple inline HTML.

checkIconName:
  type: select
  comment: Icon used before each checklist line when Content Style is Checklist.
  options:
    values: _select_data.icons

checkColor:
  type: select
  comment: Color of the oversized checkmarks in checklist mode.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White

checkmarkShadowColor:
  type: select
  comment: Shadow color behind checklist checkmarks. Use the hex override below for any custom shadow color.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White

checkmarkShadowColorHex:
  type: color
  comment: Optional custom hex shadow color for checklist checkmarks. Overrides the shadow dropdown when set.
