logoSource:
  type: image
  comment: "Logo image source URL or path."
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
formEyebrow:
  type: text
  comment: "Small label shown above the contact form heading (e.g. Get in Touch)."
formTitle:
  type: text
  comment: "Heading above the contact form/map (e.g. Contact Toothbar)."
formEmbedUrl:
  type: text
  comment: "Contact form embed URL (iframe src). Leave blank to hide the form/map section."
mapEmbedUrl:
  type: text
  comment: "Optional Google Maps embed URL (iframe src). Leave blank to auto-generate from the first office's address."
addressCardTitle:
  type: text
  comment: "Heading for the address info card."
officeHoursTitle:
  type: text
  comment: "Heading for the office hours info card."
phoneCardTitle:
  type: text
  comment: "Heading for the phone info card."
navTitle:
  type: text
  comment: "Heading for the navigation links column."
navLinks:
  type: array
  comment: "Navigation links to display in the footer."
"$.navLinks[*].name":
  type: text
"$.navLinks[*].path":
  type: text
featuredTitle:
  type: text
  comment: "Heading for the featured services column."
featuredLinks:
  type: array
  comment: "Featured service links to display in the footer."
"$.featuredLinks[*].name":
  type: text
"$.featuredLinks[*].path":
  type: text
contactTitle:
  type: text
  comment: "Heading for the contact column (e.g. Contact)."
bookText:
  type: text
  comment: "Visible text for the book appointment link."
bookLink:
  type: text
  comment: "Book appointment link URL."
offices:
  type: array
  comment: "Optional office contact override. Leave empty to use siteInfo offices. Only the first office's phone and address are shown."
  options:
    structures: _structures.officeSections
"$.offices[*].name":
  type: text
  comment: "Optional office label."
"$.offices[*].phones[*].display":
  type: text
  comment: "Phone number as displayed (e.g. (123) 456-7890)."
"$.offices[*].phones[*].href":
  type: text
  comment: "Phone href value (e.g. tel:+11234567890)."
"$.offices[*].addresses[*].lines":
  type: array
  comment: "Street address lines."
"$.offices[*].addresses[*].city":
  type: text
"$.offices[*].addresses[*].state":
  type: text
"$.offices[*].addresses[*].postalCode":
  type: text
"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: "Google Maps link for the address."
socials:
  type: array
  comment: "Array of social media links to display in the footer."
siteName:
  type: text
  comment: "Business or site name used in the footer copyright line."
legalLinks:
  type: array
  comment: "Legal/utility links shown next to the copyright line (e.g. Privacy Policy)."
legalBlurb:
  type: textarea
  comment: "Optional legal/disclaimer text shown below the copyright row."
