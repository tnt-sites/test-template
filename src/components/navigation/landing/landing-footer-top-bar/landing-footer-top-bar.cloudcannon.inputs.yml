logoSource:
  type: image
  comment: Footer logo image source.

logoAlt:
  type: text
  comment: Alt text for the footer logo.

siteName:
  type: text
  comment: Site name shown in the copyright line.

contactTitle:
  type: text
  comment: Contact column title.

offices:
  type: array
  comment: Office details used for address, phone, and office hours.
  options:
    structures: _structures.officeSections

mapEmbedUrl:
  type: text
  comment: Embedded Google Map URL for the right map panel.

legalLinks:
  type: array
  comment: Footer legal links.
  options:
    structures:
      values:
        - label: Legal Link
          icon: link
          value:
            name: ""
            path: ""
          _inputs:
            name:
              type: text
            path:
              type: text

legalBlurb:
  type: textarea
  comment: Optional legal copy shown below copyright links.

linkColor:
  type: select
  comment: Color of copyright row links.
  options:
    values:
      - id: ""
        name: None (default)
      - id: "#fff"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
      - id: "var(--color-text-strong)"
        name: Text (Strong)
      - id: "var(--color-text-inverse)"
        name: Text (Inverse)

linkHoverColor:
  type: select
  comment: Color of copyright row links on hover.
  options:
    values:
      - id: ""
        name: None (default)
      - id: "#fff"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
      - id: "var(--color-text-strong)"
        name: Text (Strong)
      - id: "var(--color-text-inverse)"
        name: Text (Inverse)

backgroundImage:
  type: object
  comment: Optional background image behind the footer.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

backgroundColor:
  type: select
  comment: Footer background color fallback when no image is provided.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

officeHoursAlignment:
  type: select
  comment: Align hours text within each office-hours row while keeping the day and time columns aligned.
  options:
    values:
      - id: right
        name: Right aligned hours
      - id: left
        name: Left aligned hours

accentColor:
  label: Accent Color
  type: color
