id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this header section."
logoSource:
  type: image
  comment: Logo image source URL or path.
logoAlt:
  type: text
  comment: Alt text for the logo image.
pageButtons:
  type: array
  comment: Header CTA buttons.
  options:
    structures: _structures.buttonSections
offices:
  type: array
  comment: Optional office override for this header.
  options:
    structures: _structures.officeSections
mobileCallSmallText:
  type: text
  comment: Small label above the phone number in the mobile call button.
mobileRequestLabel:
  type: text
  comment: Label for the request button in the mobile bar.
mobileRequestHref:
  type: text
  comment: Link for the mobile request button.
mobileCallBackgroundColor:
  type: select
  comment: Background color of the mobile call button.
  options:
    values:
      - id: ""
        name: Default (Brand Secondary)
      - id: brand
        name: Brand Primary
      - id: brand-secondary
        name: Brand Secondary
      - id: brand-tertiary
        name: Brand Tertiary
      - id: dark
        name: Dark
      - id: white
        name: White
mobileCallBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the mobile call button. Overrides the dropdown above.
mobileRequestBackgroundColor:
