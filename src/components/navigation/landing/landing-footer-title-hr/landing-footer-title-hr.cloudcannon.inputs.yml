  comment: "Footer background color."
  options:
    values:
      - id: ""
        name: Default (White)
      - id: ""
        name: None (Transparent)
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black
backgroundColorHex:
  type: color
  comment: "Optional custom hex color for the footer background. Overrides the dropdown above."
headingColor:
  type: select
  comment: "Color applied to the h3 headings and hr dividers in each column."
  options:
    values:
      - id: ""
        name: Default (Dark)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-tertiary)"
        name: Brand (Tertiary)
      - id: "var(--color-dark)"
