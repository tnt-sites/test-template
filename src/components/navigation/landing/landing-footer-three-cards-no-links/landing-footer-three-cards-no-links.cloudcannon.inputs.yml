logoSource:
  type: image
  comment: "Logo image source URL or path."
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this footer section."
siteName:
  type: text
  comment: "Business or site name used in legal copy."
contactTitle:
  type: markdown
  comment: "Heading for the contact card. Supports inline span wrappers/classes for highlighted words."
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: false
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
offices:
  type: array
  comment: "Optional office contact override for this landing footer."
  options:
    structures: _structures.officeSections
phoneLabel:
  type: text
  comment: "Small label shown above the phone number in the contact card (e.g. 'Call Today!')."
ctaText:
  type: markdown
  comment: "Call-to-action line shown below the phone number in the contact card. Supports a <strong> wrapper for emphasis."
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: false
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
mapTitle:
  type: text
  comment: "Heading for the map/find-us card."
mapEmbedUrl:
  type: text
  comment: "Map iframe embed URL shown in the map card."
formTitle:
  type: text
  comment: "Heading for the ask-a-question form card."
formAction:
  type: text
  comment: "Form action URL for submissions."
formSubject:
  type: text
  comment: "Hidden _subject value sent with the form."
formRedirect:
  type: text
  comment: "Hidden _redirect value sent with the form."
formSubmitLabel:
  type: text
  comment: "Button label for the form submit button."
formButtonBorderRadius:
  type: text
  comment: "Submit button border radius (e.g. 0px, 8px, 999px)."
formButtonTextColor:
  type: color
  comment: "Submit button text color."
formButtonBackgroundColor:
  type: color
  comment: "Submit button background color."
formButtonHoverBackgroundColor:
  type: color
  comment: "Submit button hover background color."
formButtonHoverTextColor:
  type: color
  comment: "Submit button hover text color."
contactCardBackgroundColor:
  type: text
  comment: "Optional CSS color value for the contact card background."
mapCardBackgroundColor:
  type: text
  comment: "Optional CSS color value for the map card background."
formCardBackgroundColor:
  type: text
  comment: "Optional CSS color value for the form card background."
legalLinks:
  type: array
  comment: "Legal links displayed in the footer legal row (e.g. Privacy Policy)."
backgroundImage:
  type: object
  comment: Background image configuration for the footer section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
backgroundGradient:
  type: text
  comment: "Optional CSS gradient value layered over background (e.g. linear-gradient(...))."
backgroundColor:
  type: select
  comment: Background color of the footer section.
  options:
    values:
      - id: ""
        name: None
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand (Primary)
      - id: "var(--color-bg-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.
linkColor:
  type: select
  comment: Color of legal/copy links.
  options:
    values:
      - id: ""
        name: None (default)
      - id: "#fff"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
      - id: "var(--color-text-strong)"
        name: Text (Strong)
      - id: "var(--color-text-inverse)"
        name: Text (Inverse)
linkHoverColor:
  type: select
  comment: Color of legal/copy links on hover.
  options:
    values:
      - id: ""
        name: None (default)
      - id: "#fff"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
      - id: "var(--color-text-strong)"
        name: Text (Strong)
      - id: "var(--color-text-inverse)"
        name: Text (Inverse)
legalBlurb:
  type: textarea
  comment: "Optional legal/disclaimer text shown below the copyright row."
