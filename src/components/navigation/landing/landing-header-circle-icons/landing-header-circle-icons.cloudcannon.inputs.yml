id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this header."
logoSource:
  type: image
  comment: Logo image source URL or path.
logoAlt:
  type: text
  comment: Alt text for the logo image.
pageButtons:
  type: array
  comment: Header CTA buttons.
  options:
    structures: _structures.buttonSections
offices:
  type: array
  comment: Optional office override for this header.
  options:
    structures: _structures.officeSections
mobileCallTextColor:
  type: select
  comment: Main text color of the mobile call button.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
mobileCallSmallTextColor:
  type: select
  comment: Small text color of the mobile call button.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
