heading:
  type: text
  comment: Main hero heading.

preHeading:
  type: text
  comment: Small heading text above the main heading.

postHeading:
  type: text
  comment: Small heading text below the main heading.

coupons:
  type: array
  comment: Coupon badge images shown below the heading.
  options:
    structures:
      values:
        - label: Coupon Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

image:
  type: object
  comment: Right-side hero image.
  options:
    structures:
      values:
        - label: Hero Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

figcaption:
  type: text
  comment: Caption shown over the bottom edge of the hero image.

textPanelBackgroundImage:
  type: object
  comment: Background image for the left text panel.
  options:
    structures:
      values:
        - label: Text Panel Background
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

sectionBackground:
  type: select
  comment: Overall banner background color. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text

sectionBackgroundHex:
  type: color
  comment: Optional custom hex color that overrides the section background above. Leave blank to use the theme color.

borderBottomColor:
  type: select
  comment: Color of the bottom border.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
