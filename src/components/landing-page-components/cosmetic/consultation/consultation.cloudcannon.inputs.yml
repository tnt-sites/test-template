backgroundColor:
  type: select
  comment: Background color of the consultation section.
  options:
    values:
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

heading:
  type: textarea
  comment: Section heading (h2). Supports <br> and <span> for accent color (e.g. "Request a FREE Smile Makeover <span>Consultation</span>").

formAction:
  type: url
  comment: URL that processes the form submission (e.g. a form handler endpoint or thank-you redirect).

formBlocks:
  type: array
  label: Form Fields
  comment: The form fields to render inside the form. Add inputs, textareas, hidden fields, and a submit button.
  options:
    structures: _structures.formBlocks

accentColor:
  type: select
  comment: Override accent color for the heading span. Leave blank to use the site default.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

headingColor:
  type: select
  comment: Override heading text color. Leave blank to use the site default.
  options:
    values:
      - id: "var(--color-text)"
        name: Body Text
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary

fontHeadings:
  type: text
  comment: Override heading font family. Leave blank to use the site default.
