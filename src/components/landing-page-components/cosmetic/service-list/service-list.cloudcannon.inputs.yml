backgroundColor:
  type: select
  comment: Background color of the service list bar.
  options:
    values:
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

services:
  type: array
  comment: List of cosmetic services to display as links separated by bullets.
  options:
    structures:
      values:
        - label: Service Link
          icon: link
          value:
            label: ""
            url: ""
          _inputs:
            label:
              type: text
              comment: Display name of the service (e.g. "Veneers").
            url:
              type: url
              comment: Link to the service page.

accentColor:
  type: select
  comment: Accent/link highlight color for the service list..
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White
