backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    values:
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

headingLine1:
  type: text
  comment: First line of the large left heading (e.g. "Count").

headingLine2:
  type: text
  comment: Second line of the large left heading (e.g. "On Us").

listItems:
  type: array
  comment: Checklist items displayed next to the heading. Supports inline HTML.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

accentColor:
  type: select
  comment: Color used for the card's top/bottom border and the "+" bullet markers. Controls both together.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

squareColor:
  type: select
  comment: Color of the decorative background squares that peek out from the card's corners.
  options:
    values:
      - id: "var(--color-bg-surface)"
        name: Surface (Light Gray)
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-bg-brand-muted)"
        name: Brand Muted
      - id: "var(--cyan-light)"
        name: Cyan Light
      - id: "var(--cyan-dark)"
        name: Cyan
      - id: "var(--blue-light)"
        name: Blue Light
      - id: "var(--blue-dark)"
        name: Blue

boxBorderColor:
  type: select
  comment: Color of the decorative corner bracket lines around the outside of the card.
  options:
    values:
      - id: "var(--color-bg-surface)"
        name: Surface (Light Gray)
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-bg-brand-muted)"
        name: Brand Muted
      - id: "var(--cyan-light)"
        name: Cyan Light
      - id: "var(--cyan-dark)"
        name: Cyan
      - id: "var(--blue-light)"
        name: Blue Light
      - id: "var(--blue-dark)"
        name: Blue
      - id: "var(--color-brand)"
        name: Brand (Solid)
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary (Solid)

headingColor:
  type: select
  comment: Color of the large left heading text.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

fontHeadings:
  type: text
  comment: Override the heading font family (e.g. "Georgia, serif"). Leave blank to use the site default.

fontBody:
  type: text
  comment: Override the list font family (e.g. "Arial, sans-serif"). Leave blank to use the site default.
