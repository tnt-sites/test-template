backgroundColor:
  type: select
  comment: Background color (used as fallback if no background image is set).
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

backgroundImage:
  type: object
  comment: Optional full-bleed background image behind the review card.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the background image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

reviewText:
  type: textarea
  comment: The review quote text. Opening and closing quotation marks are added automatically.

author:
  type: text
  comment: Author name displayed below the review quote (e.g. "- Levi P.").

googleLogoImage:
  type: object
  comment: Optional Google logo or reviewer avatar in the left panel.
  options:
    structures:
      values:
        - label: Google Logo
          icon: image
          value:
            source: ""
            alt: Google Reviews
          _inputs:
            source:
              type: image
              comment: Path or URL to the Google logo or avatar.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

starColor:
  type: color
  comment: Color of the five star symbols in the Google panel.

bracketColor:
  type: select
  comment: Color of the decorative corner bracket lines around the review card.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

googlePanelColor:
  type: select
  comment: Background color of the Google panel on the left side of the card.
  options:
    values:
      - id: "rgba(203, 116, 40, 0.06)"
        name: Warm Tint (default)
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-bg-brand-muted)"
        name: Brand Muted
      - id: "var(--cyan-light)"
        name: Cyan Light

fontHeadings:
  type: text
  comment: Override the heading font family. Leave blank to use the site default.

fontBody:
  type: text
  comment: Override the body/quote font family. Leave blank to use the site default.
