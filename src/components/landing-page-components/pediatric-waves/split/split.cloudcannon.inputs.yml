backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

heading:
  type: text
  comment: Main section heading. Supports <br> line breaks.

headingFontFamily:
  type: text
  comment: Optional heading font family override.

paragraphs:
  type: array
  comment: Body paragraphs for this split section.
  options:
    structures:
      values:
        - label: Paragraph
          icon: format_paragraph
          value:
            body: ""
          _inputs:
            body:
              type: textarea
              comment: Paragraph text. Supports inline HTML for emphasis.

image:
  type: object
  comment: Image displayed in the second column.
  options:
    structures:
      values:
        - label: Section Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional image caption.

reverse:
  type: checkbox
  comment: Move the image to the left on desktop when enabled.

buttonSections:
  type: array
  comment: Optional call-to-action button group.
  options:
    structures: _structures.buttonSections

headingColor:
  type: select
  comment: Optional heading color override.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Body Text
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary

accentColor:
  type: select
  comment: Accent color used for emphasized inline text.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary

waveImage:
  type: object
  comment: Optional decorative side wave image.
  options:
    structures:
      values:
        - label: Side Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the side wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.
