backgroundColor:
  type: select
  comment: Background color used behind the review.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.
image:
  type: object
  comment: Google logo that goes above the desktop review text.
  options:
    structures:
      values:
        - label: Desktop Reviews Image
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.
mobileImage:
  type: object
  comment: Google logo that goes above the mobile review text.
  options:
    structures:
      values:
        - label: Mobile Reviews Image
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.
backgroundImage:
  type: object
  comment: Background image configuration for the reviews section.
  options:
    structures:
      values:
        - label: Background Image for Reviews
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
reviewText:
  type: markdown
  comment: Main Review Text
  options:
    blockquote: false
    bold: true
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
author:
  type: text
  comment: Author Name
authorAlignX:
  type: select
  comment: Alignment of the author text.
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
textColor:
  type: select
  comment: Color of the review text.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White
mobileTextColor:
  type: select
  comment: Color of the review text on mobile.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White
starColor:
  type: color
  comment: Color of the review stars.
