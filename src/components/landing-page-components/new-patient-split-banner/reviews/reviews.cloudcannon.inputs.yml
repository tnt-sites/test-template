backgroundColor:
  type: select
  comment: Background color (used as fallback if no background image is set).
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

backgroundImage:
  type: object
  comment: Full-bleed background image for the reviews section.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the background image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

heading:
  type: text
  comment: Section heading displayed above the review quote.

reviewText:
  type: textarea
  comment: The review quote text (opening/closing quotes are added automatically).

author:
  type: text
  comment: Author name displayed below the stars.

googleLogoImage:
  type: object
  comment: Optional Google logo or reviewer avatar displayed next to the author name.
  options:
    structures:
      values:
        - label: Google Logo
          icon: image
          value:
            source: ""
            alt: Google Reviews
          _inputs:
            source:
              type: image
              comment: Path or URL to the Google logo or avatar.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

starColor:
  type: color
  comment: Color used for the star rating.

fontHeadings:
  type: text
  comment: Override the heading font family (e.g. "Georgia, serif"). Leave blank to use the site default.
