backgroundColor:
  type: select
  comment: Background color of the review cards section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

reviews:
  type: array
  comment: Review cards shown in a 3-up layout on desktop and stacked on mobile.
  options:
    structures:
      values:
        - label: Review Card
          icon: reviews
          value:
            reviewText: ""
            author: ""
            stars: 5
            googleLogoImage:
              source: ""
              alt: Google logo
          _inputs:
            reviewText:
              type: textarea
              comment: Review text for this card.
            author:
              type: text
              comment: Reviewer name.
            stars:
              type: number
              comment: Number of stars to show (0-5).
            googleLogoImage:
              type: object
              comment: Google logo shown next to the reviewer details.
              options:
                structures:
                  values:
                    - label: Google Logo
                      icon: image
                      value:
                        source: ""
                        alt: Google logo
                      _inputs:
                        source:
                          type: image
                          comment: Path or URL to the Google logo image.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: text
                          comment: Alt text for accessibility.

cardBackgroundColor:
  type: color
  comment: Background color of each review card.

textColor:
  type: color
  comment: Text color used for review copy and author details.

starColor:
  type: color
  comment: Color used for the star rating.
