backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

headingPrefix:
  type: text
  comment: Optional small label displayed above the main heading.

heading:
  type: text
  comment: Main section heading. Supports <br> for line breaks.

listItems:
  type: array
  comment: Checklist items displayed in the article. Supports inline HTML.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

checkImage:
  type: image
  comment: Optional checkmark image used as the list bullet. Leave blank to use the default ✓ symbol.
  options:
    paths:
      uploads: src/assets/images
      static: ""

image:
  type: object
  comment: Image displayed on the opposite side of the content.
  options:
    structures:
      values:
        - label: Section Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption below the image.

reverse:
  type: checkbox
  comment: When enabled, the image appears on the left and text on the right.

twoColumnList:
  type: checkbox
  comment: When enabled, the list renders in two columns on desktop.

headingColor:
  type: select
  comment: Color of the main h2 heading text.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

prefixColor:
  type: select
  comment: Color of the small prefix label above the heading. Defaults to the heading color when left unset.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

fontHeadings:
  type: text
  comment: Override the heading font family (e.g. "Georgia, serif"). Leave blank to use the site default.

fontBody:
  type: text
  comment: Override the body/prefix font family (e.g. "Arial, sans-serif"). Leave blank to use the site default.
