backgroundColor:
  type: select
  comment: Background color of the section. The dark section background is applied by sectionColor below; set this to "none" unless you need a theme color instead.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

items:
  type: array
  comment: Each card in the dark callout strip.
  options:
    structures:
      values:
        - label: Callout Card
          icon: dashboard
          value:
            headingLine1: ""
            headingLine2: ""
            iconName: ""
            iconCount: 1
            iconColor: ""
            link: ""
          _inputs:
            headingLine1:
              type: text
              comment: First line of the heading, shown above the icon row (e.g. "Find Us").
            headingLine2:
              type: text
              comment: Second line of the heading, shown below the icon row (e.g. "On The Map").
            iconName:
              type: text
              comment: Fontello icon class name (e.g. "icon-map-marker", "icon-star"). See tntwebsites.com/tnticons/demo.html for all options. Leave blank for no icon.
            iconCount:
              type: number
              comment: Number of times to repeat the icon (e.g. 5 for five stars). Min 1, max 10.
            iconColor:
              type: color
              comment: Color of the icon(s). Leave blank to use the section accent color.
            iconPosition:
              type: select
              comment: Where the icon row appears relative to the heading text.
              options:
                values:
                  - id: middle
                    name: Between lines (default)
                  - id: bottom
                    name: Below heading
            link:
              type: url
              comment: Optional URL the card links to. Leave blank for a non-clickable card.

sectionColor:
  type: color
  comment: Background color of the dark strip. Defaults to #324248 (dark teal).

accentColor:
  type: select
  comment: Color of the inset border overlay on each portrait card.
  options:
    values:
      - id: "#15A1DC"
        name: Implants Blue (default)
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary

fontHeadings:
  type: text
  comment: Override heading font family. Leave blank for site default.

fontBody:
  type: text
  comment: Override body font family. Leave blank for site default.
