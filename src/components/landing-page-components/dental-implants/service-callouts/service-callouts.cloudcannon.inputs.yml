backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

heading:
  type: text
  comment: Optional section heading above the cards (e.g. "Your Implant Options"). Supports <br>.

headingFontFamily:
  type: text
  comment: Override the font family for this heading. Leave blank to use the site default. Use any font family loaded by the page, including extra fonts.

items:
  type: array
  comment: Each card represents one implant service option.
  options:
    structures:
      values:
        - label: Service Card
          icon: link
          value:
            heading: ""
            image:
              source: ""
              alt: ""
            text: ""
            link: ""
          _inputs:
            heading:
              type: text
              comment: Title displayed above the portrait image.
            image:
              type: object
              options:
                structures:
                  values:
                    - label: Image
                      icon: image
                      value:
                        source: ""
                        alt: ""
                      _inputs:
                        source:
                          type: image
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: textarea
            text:
              type: textarea
              comment: Short description shown below the portrait.
            link:
              type: url
              comment: URL the card links to.

headingColor:
  type: select
  comment: Color of the section heading and card h3 titles.
  options:
    values:
      - id: "var(--color-heading)"
        name: Default Heading
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#324248"
        name: Dark Teal

accentColor:
  type: select
  comment: Hover accent color for card portrait borders and headings.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#15A1DC"
        name: Implants Blue

fontHeadings:
  type: text
  comment: Override heading font family. Leave blank for site default.

fontBody:
  type: text
  comment: Override body font family. Leave blank for site default.
