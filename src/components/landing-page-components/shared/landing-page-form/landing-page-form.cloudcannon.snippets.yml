landingPageForm:
  template: mdx_component
  inline: false
  preview:
    text:
      - Landing Page Form
    icon: add
  definitions:
    component_name: LandingPageForm
    named_args:
      - editor_key: id
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: formAction
        type: string
        optional: true
        remove_empty: true
      - editor_key: formBlocks
        type: array
        optional: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundGradient
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundImage
        type: object
        optional: true
  _inputs_from_glob:
    - /src/components/landing-page-components/shared/landing-page-form/landing-page-form.cloudcannon.inputs.yml
