backgroundColor:
  type: select
  comment: Background color of the banner section. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: ""
        name: None
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand (Primary)
      - id: "var(--color-bg-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

heading:
  type: text
  comment: Main heading text. Supports <br> for manual line breaks.

consultationTitle:
  type: text
  comment: Title for the consultation block. Supports <br> for manual line breaks.

consultationItems:
  type: array
  comment: List of items for the consultation block.
  options:
    structures:
      values:
        - label: List Item
          value: ""

image:
  type: object
  comment: Banner image displayed on the left side.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the banner photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

borderColor:
  type: select
  comment: Color of the decorative border on the consultation block.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

titleBackground:
  type: select
  comment: Background color of the title section. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: ""
        name: None
      - id: "var(--color-bg)"
        name: Base
      - id: "var(--color-bg-surface)"
        name: Surface
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand (Primary)
      - id: "var(--color-bg-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-bg-dark)"
        name: Dark
      - id: "var(--color-bg-black)"
        name: Black

titleBackgroundHex:
  type: color
  comment: Optional custom hex color that overrides the title background color above. Leave blank to use the theme color.

titleColor:
  type: select
  comment: Color of the title text on the consultation block.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White
