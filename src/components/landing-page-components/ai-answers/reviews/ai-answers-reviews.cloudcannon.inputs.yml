backgroundColor:
  type: select
  comment: Background color of the reviews section.
  options:
    values:
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

heading:
  type: text
  comment: Section heading. Supports <br> for manual line breaks.

image:
  type: object
  comment: Decorative image displayed beside the heading.
  options:
    structures:
      values:
        - label: Section Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

headingColor:
  type: select
  comment: Color of the section heading.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "#0A4172"
        name: Navy
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

borderColor:
  type: select
  comment: Border color for each review card.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "#0A4172"
        name: Navy
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

starColor:
  type: color
  comment: Color of the star rating icons.

reviews:
  type: array
  comment: List of review cards to display.
  options:
    structures:
      values:
        - label: Review
          icon: rate_review
          value:
            googleLogo:
              source: ""
              alt: Google Reviews
            text: ""
            author: ""
          _inputs:
            googleLogo:
              type: object
              comment: Optional Google logo displayed above the review.
              options:
                structures:
                  values:
                    - label: Google Logo
                      icon: image
                      value:
                        source: ""
                        alt: Google Reviews
                      _inputs:
                        source:
                          type: image
                          comment: Path or URL to the Google logo image.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: text
                          comment: Alt text for the logo.
            text:
              type: textarea
              comment: The body text of the review.
            author:
              type: text
              comment: Author attribution, e.g. "- Jane D."
