backgroundColor:
  type: select
  comment: Background color of the welcome section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

paragraphs:
  type: array
  comment: Each item is one paragraph. The "emphasis" text is displayed in the accent color at the start.
  options:
    structures:
      values:
        - label: Paragraph
          icon: format_paragraph
          value:
            emphasis: ""
            body: ""
          _inputs:
            emphasis:
              type: text
              comment: Short emphasized phrase displayed in the accent color at the start of the paragraph (e.g. "We understand."). Leave blank to start the paragraph with plain text.
            body:
              type: textarea
              comment: The rest of the paragraph text following the emphasized phrase.

accentColor:
  type: select
  comment: Color of the emphasized phrase at the start of each paragraph.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

fontBody:
  type: text
  comment: Override the body font family. Leave blank for site default.
