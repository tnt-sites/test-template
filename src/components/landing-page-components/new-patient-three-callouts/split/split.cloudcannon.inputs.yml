backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

heading:
  type: text
  comment: Section heading (h2). Supports <br> for manual line breaks.

headingFontFamily:
  type: text
  comment: Override the font family for this heading. Leave blank to use the site default. Use any font family loaded by the page, including extra fonts.

listItems:
  type: array
  comment: Bullet list items displayed below the heading. Each item gets a + marker.
  options:
    structures:
      values:
        - label: List Item
          icon: add
          value: ""

image:
  type: object
  comment: Photo displayed on the opposite side of the content.
  options:
    structures:
      values:
        - label: Section Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption displayed below the photo.

reverse:
  type: checkbox
  comment: When enabled, the photo appears on the left and content on the right.

buttonSections:
  type: array
  comment: Optional CTA button(s) displayed below the list.
  options:
    structures: _structures.buttonSections

accentColor:
  type: select
  comment: Color of the + bullet markers and the H2 heading.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#000"
        name: Black
      - id: "var(--color-text-inverse)"
        name: White

headingColor:
  type: select
  comment: Color of the H2 heading. Overrides accentColor for the heading only.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "var(--color-text)"
        name: Body Text
      - id: "var(--color-text-inverse)"
        name: White

fontHeadings:
  type: text
  comment: Override the heading font family. Leave blank for site default.

fontBody:
  type: text
  comment: Override the list font family. Leave blank for site default.
